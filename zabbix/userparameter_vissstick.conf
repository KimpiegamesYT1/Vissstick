# Vissstick Discord bot — white-box monitoring
# Kopieer naar /etc/zabbix/zabbix_agent2.d/ en herstart zabbix-agent2.
#
# $1 = METRICS_PORT van de bot (template macro {$VISSSTICK.METRICS.PORT}, standaard 9464).
# Het endpoint luistert alleen op 127.0.0.1, dus de agent moet in dezelfde LXC draaien.
UserParameter=vissstick.metrics[*],curl -fsS -m 2 "http://127.0.0.1:$1/metrics"
