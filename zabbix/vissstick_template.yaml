              path: '$.name'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.jobs'
        - uuid: '079e9155aa6b512f906517576338ac45'
          name: 'Webroutes discovery'
          type: 'DEPENDENT'
          key: 'vissstick.routes.discovery'
          delay: '0'
          lifetime: '7d'
          description: 'Routegroepen van de webserver: page, static, sse, hok_api, api_<spel>, other.'
          item_prototypes:
            - uuid: '690d4eabca685dbb928da945eab04c1d'
              name: 'Route {#ROUTE}: requests per seconde'
              type: 'DEPENDENT'
              key: 'vissstick.route.rps[{#ROUTE}]'
              delay: '0'
              history: '31d'
              value_type: 'FLOAT'
              units: 'rps'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.http.routes[?(@.route==''{#ROUTE}'')].requests.first()'
                - type: 'CHANGE_PER_SECOND'
                  parameters:
                    - ''
              master_item:
                key: 'vissstick.metrics[{$VISSSTICK.METRICS.PORT}]'
              tags:
                - tag: 'component'
                  value: 'web'
            - uuid: 'b4bae761265e5c3dbc4fef943186968a'
              name: 'Route {#ROUTE}: 4xx per minuut'
              type: 'DEPENDENT'
              key: 'vissstick.route.4xx[{#ROUTE}]'
              delay: '0'
              history: '31d'
              value_type: 'FLOAT'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.http.routes[?(@.route==''{#ROUTE}'')].errors4xx.first()'
                - type: 'SIMPLE_CHANGE'
                  parameters:
                    - ''
              master_item:
                key: 'vissstick.metrics[{$VISSSTICK.METRICS.PORT}]'
              tags:
                - tag: 'component'
                  value: 'web'
            - uuid: '1445e643f96553509feb994d138d7e3f'
              name: 'Route {#ROUTE}: 5xx per minuut'
              type: 'DEPENDENT'
              key: 'vissstick.route.5xx[{#ROUTE}]'
              delay: '0'
              history: '31d'
              value_type: 'FLOAT'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.http.routes[?(@.route==''{#ROUTE}'')].errors5xx.first()'
                - type: 'SIMPLE_CHANGE'
                  parameters:
                    - ''
              master_item:
                key: 'vissstick.metrics[{$VISSSTICK.METRICS.PORT}]'
              tags:
                - tag: 'component'
                  value: 'web'
            - uuid: 'c6e5bcefb5d8515ea9de6a7fbfddc89b'
              name: 'Route {#ROUTE}: gemiddelde responstijd (sinds start)'
              type: 'DEPENDENT'
              key: 'vissstick.route.latency[{#ROUTE}]'
              delay: '0'
              history: '31d'
              value_type: 'FLOAT'
              units: 'ms'
              preprocessing:
                - type: 'JSONPATH'
                  parameters:
                    - '$.http.routes[?(@.route==''{#ROUTE}'')].avgLatencyMs.first()'
              master_item:
                key: 'vissstick.metrics[{$VISSSTICK.METRICS.PORT}]'
              tags:
                - tag: 'component'
                  value: 'web'
          trigger_prototypes:
            - uuid: 'f06c2c61277e5b529e48dc1b36e1e24d'
              expression: 'sum(/Vissstick Discord Bot/vissstick.route.5xx[{#ROUTE}],5m)>{$VISSSTICK.HTTP.5XX.MAX}'
              name: 'Vissstick: route {#ROUTE} geeft 5xx fouten'
              priority: 'WARNING'
              tags:
                - tag: 'scope'
                  value: 'performance'
          master_item:
            key: 'vissstick.metrics[{$VISSSTICK.METRICS.PORT}]'
          lld_macro_paths:
            - lld_macro: '{#ROUTE}'
              path: '$.route'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$.http.routes'
      tags:
        - tag: 'class'
          value: 'application'
        - tag: 'target'
          value: 'vissstick'
      macros:
        - macro: '{$VISSSTICK.METRICS.PORT}'
          value: '9464'
          description: 'METRICS_PORT van de bot'
        - macro: '{$VISSSTICK.WEB.PORT}'
          value: '3000'
          description: 'PUBLIC_API_PORT van de bot'
        - macro: '{$VISSSTICK.CLOUDFLARED.MIN}'
          value: '1'
          description: 'Minimaal aantal cloudflared processen; 0 als de tunnel elders draait'
        - macro: '{$VISSSTICK.DISCORD.PING.MAX}'
          value: '500'
          description: 'ms'
        - macro: '{$VISSSTICK.DISCORD.RECONNECTS.MAX}'
          value: '5'
          description: 'per uur'
        - macro: '{$VISSSTICK.DISCORD.RATELIMITS.MAX}'
          value: '10'
          description: 'per 15 minuten'
        - macro: '{$VISSSTICK.WEB.LOADTIME.MAX}'
          value: '2'
          description: 'seconden'
        - macro: '{$VISSSTICK.HTTP.5XX.MAX}'
          value: '5'
          description: 'per 5 minuten'
        - macro: '{$VISSSTICK.HTTP.429.MAX}'
          value: '100'
          description: 'per 5 minuten'
        - macro: '{$VISSSTICK.HTTP.P95.MAX}'
          value: '500'
          description: 'ms (exclusief SSE)'
        - macro: '{$VISSSTICK.LOOP.P99.MAX}'
          value: '200'
          description: 'ms'
        - macro: '{$VISSSTICK.RSS.MAX}'
          value: '1G'
          description: 'bytes'
        - macro: '{$VISSSTICK.ERRORS.MAX}'
          value: '20'
          description: 'per 10 minuten'
        - macro: '{$VISSSTICK.DB.LATENCY.MAX}'
          value: '100'
          description: 'ms'
        - macro: '{$VISSSTICK.DB.WAL.MAX}'
          value: '100M'
          description: 'bytes'
        - macro: '{$VISSSTICK.BACKUP.AGE.MAX}'
          value: '14d'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX}'
          value: '3'
          description: 'Aantal keer op rij mislukt voor een alarm (per taak te overschrijven met context)'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"quiz_start"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"quiz_end"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"spin_reminders"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"math_schedule"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"math_close"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"monthly_reset"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
        - macro: '{$VISSSTICK.JOB.FAILS.MAX:"register_commands"}'
          value: '1'
          description: 'Draait één keer per dag/maand/start'
      valuemaps:
        - uuid: '593758c9ef3b5fd1a397b92a45616d1f'
          name: 'Discord gateway status'
          mappings:
            - value: '-1'
              newvalue: 'Onbekend'
            - value: '0'
              newvalue: 'Ready'
            - value: '1'
              newvalue: 'Connecting'
            - value: '2'
              newvalue: 'Reconnecting'
            - value: '3'
              newvalue: 'Idle'
            - value: '4'
              newvalue: 'Nearly'
            - value: '5'
              newvalue: 'Disconnected'
            - value: '6'
              newvalue: 'WaitingForGuilds'
            - value: '7'
              newvalue: 'Identifying'
            - value: '8'
              newvalue: 'Resuming'
        - uuid: 'ed9ed01eebe758259970d58a4dcb1a59'
          name: 'Vissstick healthy'
          mappings:
            - value: '0'
              newvalue: 'Problemen'
            - value: '1'
              newvalue: 'OK'
        - uuid: 'ff24e4571c4e5c81b83e49bb56a81780'
          name: 'Vissstick yes/no'
          mappings:
            - value: '-1'
              newvalue: 'Onbekend'
            - value: '0'
              newvalue: 'Nee'
            - value: '1'
              newvalue: 'Ja'
  triggers:
    - uuid: 'e37f421e932a51d496e99afae137f0b6'
      expression: 'last(/Vissstick Discord Bot/proc.num[node,,,bot.js])=0'
      name: 'Vissstick: bot-proces draait niet'
      priority: 'HIGH'
      description: 'Er draait geen "node bot.js" proces in deze container.'
      tags:
        - tag: 'scope'
          value: 'availability'
    - uuid: '8d8aa58b10d255519d09b8228833e656'
      expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      name: 'Vissstick: geen monitoring data (bot reageert niet)'
      priority: 'HIGH'
      description: 'Het /metrics endpoint gaf 5 minuten geen antwoord. Het proces draait wel: waarschijnlijk hangt de event loop, of METRICS_ENABLED staat uit.'
      dependencies:
        - name: 'Vissstick: bot-proces draait niet'
          expression: 'last(/Vissstick Discord Bot/proc.num[node,,,bot.js])=0'
      tags:
        - tag: 'scope'
          value: 'availability'
    - uuid: 'ac3b7d63f3c05cb4be5e28c302977b25'
      expression: 'last(/Vissstick Discord Bot/vissstick.uptime)<600'
      name: 'Vissstick: bot is herstart'
      priority: 'INFO'
      description: 'Uptime is minder dan 10 minuten.'
      manual_close: 'YES'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '87d927bde0ea5069990e449f3abd7b5a'
      expression: 'max(/Vissstick Discord Bot/vissstick.discord.ready,5m)=0 and last(/Vissstick Discord Bot/vissstick.uptime)>300'
      name: 'Vissstick: Discord gateway niet verbonden'
      priority: 'HIGH'
      description: 'De bot is al 5 minuten niet verbonden met Discord.'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'availability'
    - uuid: 'bb10ca6013355969b45b5661bd939981'
      expression: 'min(/Vissstick Discord Bot/vissstick.discord.ping,10m)>{$VISSSTICK.DISCORD.PING.MAX}'
      name: 'Vissstick: hoge Discord ping (>{$VISSSTICK.DISCORD.PING.MAX} ms)'
      priority: 'WARNING'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '6c007551b5b65219b728f0925c5d933d'
      expression: 'sum(/Vissstick Discord Bot/vissstick.discord.reconnects,1h)>{$VISSSTICK.DISCORD.RECONNECTS.MAX}'
      name: 'Vissstick: Discord gateway reconnect vaak (>{$VISSSTICK.DISCORD.RECONNECTS.MAX} per uur)'
      priority: 'WARNING'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '5a688ac4fc6655528a44701fbb365850'
      expression: 'sum(/Vissstick Discord Bot/vissstick.discord.rest_rate_limits,15m)>{$VISSSTICK.DISCORD.RATELIMITS.MAX}'
      name: 'Vissstick: Discord REST rate limits (>{$VISSSTICK.DISCORD.RATELIMITS.MAX} per 15 min)'
      priority: 'WARNING'
      description: 'De bot stuurt te veel API-verzoeken naar Discord; berichten/updates kunnen vertraagd zijn.'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '2e97d532e0595c358ee970edfd220c44'
      expression: 'last(/Vissstick Discord Bot/net.tcp.listen[{$VISSSTICK.WEB.PORT}])=0 and last(/Vissstick Discord Bot/vissstick.uptime)>300'
      name: 'Vissstick: webserver luistert niet op poort {$VISSSTICK.WEB.PORT}'
      priority: 'HIGH'
      dependencies:
        - name: 'Vissstick: bot-proces draait niet'
          expression: 'last(/Vissstick Discord Bot/proc.num[node,,,bot.js])=0'
      tags:
        - tag: 'scope'
          value: 'availability'
    - uuid: 'd7743c8fac94556a800a8fa2362ecb5f'
      expression: 'max(/Vissstick Discord Bot/web.page.perf[127.0.0.1,/api/public/hok/status,{$VISSSTICK.WEB.PORT}],5m)=0 or nodata(/Vissstick Discord Bot/web.page.perf[127.0.0.1,/api/public/hok/status,{$VISSSTICK.WEB.PORT}],5m)=1'
      name: 'Vissstick: hok API geeft geen antwoord'
      priority: 'AVERAGE'
      description: 'web.page.perf naar /api/public/hok/status mislukt al 5 minuten.'
      dependencies:
        - name: 'Vissstick: webserver luistert niet op poort {$VISSSTICK.WEB.PORT}'
          expression: 'last(/Vissstick Discord Bot/net.tcp.listen[{$VISSSTICK.WEB.PORT}])=0 and last(/Vissstick Discord Bot/vissstick.uptime)>300'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '69c77b9b29cb515a9a25aa0e51617fd9'
      expression: 'min(/Vissstick Discord Bot/web.page.perf[127.0.0.1,/api/public/hok/status,{$VISSSTICK.WEB.PORT}],5m)>{$VISSSTICK.WEB.LOADTIME.MAX}'
      name: 'Vissstick: hok API traag (>{$VISSSTICK.WEB.LOADTIME.MAX}s)'
      priority: 'WARNING'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '57f4b7b4d71d5a6ab5df9ef5a287be4c'
      expression: 'sum(/Vissstick Discord Bot/vissstick.http.5xx,5m)>{$VISSSTICK.HTTP.5XX.MAX}'
      name: 'Vissstick: webserver geeft 5xx fouten (>{$VISSSTICK.HTTP.5XX.MAX} in 5 min)'
      priority: 'AVERAGE'
      description: 'Zie de route-discovery welke route het is, en "Proces: laatste foutmelding".'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '96538c57e10a5168acf8d384cd8b6c14'
      expression: 'min(/Vissstick Discord Bot/vissstick.http.latency.p95,5m)>{$VISSSTICK.HTTP.P95.MAX}'
      name: 'Vissstick: webserver traag (p95 >{$VISSSTICK.HTTP.P95.MAX} ms)'
      priority: 'WARNING'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: 'e2799e8a4d155076989987667d6494f8'
      expression: 'sum(/Vissstick Discord Bot/vissstick.http.429,5m)>{$VISSSTICK.HTTP.429.MAX}'
      name: 'Vissstick: veel rate-limited requests (>{$VISSSTICK.HTTP.429.MAX} in 5 min)'
      priority: 'INFO'
      description: 'Mogelijk misbruik of een kapotte client die te vaak pollt.'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: 'd77ad0f62dc95c92ab5444e72eed7114'
      expression: 'last(/Vissstick Discord Bot/vissstick.http.sse_clients)>=last(/Vissstick Discord Bot/vissstick.http.sse_limit)*0.9 and last(/Vissstick Discord Bot/vissstick.http.sse_limit)>0'
      name: 'Vissstick: live verbindingen bijna op limiet'
      priority: 'WARNING'
      description: 'Boven de limiet krijgen nieuwe spelers 503 too_many_clients.'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '58f61c819ada56a8a232622e3f663998'
      expression: 'min(/Vissstick Discord Bot/vissstick.loop.p99,5m)>{$VISSSTICK.LOOP.P99.MAX}'
      name: 'Vissstick: event loop geblokkeerd (p99 >{$VISSSTICK.LOOP.P99.MAX} ms)'
      priority: 'WARNING'
      description: 'Alles in de bot (Discord, web, spellen) reageert dan trager.'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '5e15689d7a2253bd91a02b6bc0a61c1a'
      expression: 'min(/Vissstick Discord Bot/vissstick.rss,15m)>{$VISSSTICK.RSS.MAX}'
      name: 'Vissstick: hoog geheugengebruik (>{$VISSSTICK.RSS.MAX})'
      priority: 'WARNING'
      description: 'Blijft dit stijgen na een herstart, dan is er waarschijnlijk een geheugenlek.'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '0c6c70d8988056c48a0c78dde355a8f3'
      expression: 'sum(/Vissstick Discord Bot/vissstick.errors,10m)>{$VISSSTICK.ERRORS.MAX}'
      name: 'Vissstick: veel fouten in de log (>{$VISSSTICK.ERRORS.MAX} in 10 min)'
      priority: 'WARNING'
      description: 'Laatste fout: zie item "Proces: laatste foutmelding" of logs/bot-<datum>.log.'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '948e1fc14f9052948e151ddeecacc902'
      expression: 'sum(/Vissstick Discord Bot/vissstick.unhandled_rejections,1h)>0'
      name: 'Vissstick: unhandled promise rejection'
      priority: 'WARNING'
      description: 'Er is een fout niet afgevangen. Zie logs/bot-<datum>.log.'
      manual_close: 'YES'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '8c70cd7f8c0b5100bd8adf1342c9084a'
      expression: 'max(/Vissstick Discord Bot/vissstick.db.ok,3m)=0 and last(/Vissstick Discord Bot/vissstick.uptime)>300'
      name: 'Vissstick: database niet bereikbaar'
      priority: 'HIGH'
      description: 'Zie item "Database: laatste fout".'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'availability'
    - uuid: '5ca88bf18c8f59c295e5994f57b59902'
      expression: 'min(/Vissstick Discord Bot/vissstick.db.latency,5m)>{$VISSSTICK.DB.LATENCY.MAX}'
      name: 'Vissstick: database traag (>{$VISSSTICK.DB.LATENCY.MAX} ms)'
      priority: 'WARNING'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '666209ed66c45ea6b2206c0face6e4bd'
      expression: 'last(/Vissstick Discord Bot/vissstick.db.wal_size)>{$VISSSTICK.DB.WAL.MAX}'
      name: 'Vissstick: SQLite WAL bestand groot (>{$VISSSTICK.DB.WAL.MAX})'
      priority: 'WARNING'
      description: 'De WAL wordt niet meer gecheckpoint; vaak een lang lopende lees-transactie.'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: 'f0355db8824b5272bedd5fe5562f6036'
      expression: 'last(/Vissstick Discord Bot/vissstick.backup.age)>{$VISSSTICK.BACKUP.AGE.MAX}'
      name: 'Vissstick: laatste database back-up ouder dan {$VISSSTICK.BACKUP.AGE.MAX}'
      priority: 'WARNING'
      description: 'startscript maakt alleen een back-up bij een (her)start van de bot.'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '93c105e12db650e388e843bf3b034f1c'
      expression: 'last(/Vissstick Discord Bot/vissstick.backup.readable)=0 and last(/Vissstick Discord Bot/vissstick.uptime)>300'
      name: 'Vissstick: back-up map niet leesbaar'
      priority: 'INFO'
      description: 'Controleer METRICS_BACKUP_DIR in config.json (standaard /root/discord-bot-backup).'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '4482a8d74702577e8fd2e10dc5dc3f32'
      expression: 'max(/Vissstick Discord Bot/vissstick.healthy,5m)=0'
      name: 'Vissstick: bot meldt problemen'
      priority: 'INFO'
      description: 'Samenvatting van de bot zelf; zie item "Bot: problemen". Specifiekere triggers hierboven geven de details.'
      dependencies:
        - name: 'Vissstick: geen monitoring data (bot reageert niet)'
          expression: 'nodata(/Vissstick Discord Bot/vissstick.uptime,5m)=1'
      tags:
        - tag: 'scope'
          value: 'performance'
    - uuid: '82b63613296f5d9c927d2460265cf07c'
      expression: 'last(/Vissstick Discord Bot/proc.num[cloudflared])<{$VISSSTICK.CLOUDFLARED.MIN}'
      name: 'Vissstick: cloudflared tunnel draait niet'
      priority: 'HIGH'
      description: 'De casino-site is dan niet bereikbaar van buitenaf.'
      tags:
        - tag: 'scope'
          value: 'availability'
  graphs:
    - uuid: '1a846f7069855fdb8586a8670df761fe'
      name: 'Vissstick: geheugen'
