    - uuid: '54484d46b2c857db9e4bbc662a99cb2a'
      name: 'Vissstick: webverkeer'
      graph_items:
        - sortorder: '0'
          color: '1A7C11'
          item:
            host: 'Vissstick Discord Bot'
            key: 'vissstick.http.rps'
