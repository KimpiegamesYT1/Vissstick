<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vissstick Sterrenrad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23140d2e'/%3E%3Ccircle cx='20' cy='22' r='13' fill='none' stroke='%23c9a6ff' stroke-width='5' stroke-dasharray='4 2.8'/%3E%3Ccircle cx='20' cy='22' r='4' fill='%23f2c14e'/%3E%3Cpath d='M16 4h8l-4 7z' fill='%23f2c14e'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #05040c;
    --panel: #110e22;
    --side: #151129;
    --field: #0c0a19;
    --raise: #241e44;
    --line: rgba(201, 166, 255, 0.12);
    --text: #f1edff;
    --muted: #958db5;
    --gold: #f2c14e;
    --green: #4cd47b;
    --red: #ef5b4c;
    --violet: #b98cff;
    --radius: 14px;
    --nav-bg: rgba(17, 14, 34, .8);
    --nav-blur: blur(8px);
    --c1: #23b5c9; --c2: #f0a92e; --c5: #d9439a; --c10: #6fcf3d;
    --ccoin: #e8493a; --cmeteor: #ff7a2a; --chunt: #1fae7a; --cworm: #8a4dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; min-height: 100vh; overflow-x: hidden; }
  button, input { font: inherit; color: inherit; }
  .app { max-width: 1600px; margin: 0 auto; padding: 12px 16px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .app > header { flex: none; }
  .board { flex: none; }

  /* Kopregel (zelfde als de andere spellen) */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .brand svg { width: 36px; height: 36px; flex: none; }
  .brand .word { display: flex; flex-direction: column; line-height: 1; }
  .brand .word small { font-size: 10px; font-weight: 800; letter-spacing: 3px; color: var(--muted); }
  .brand .word b { font-size: 19px; font-weight: 800; letter-spacing: .5px; margin-top: 3px; }
  .user { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 4px; }
  .user[hidden] { display: none; }
  .user img { width: 30px; height: 30px; border-radius: 50%; background: var(--raise); }
  .user .name { font-weight: 700; font-size: 14px; line-height: 1.1; }
  .user .balance { color: var(--gold); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; transition: color .2s; }
  .user .balance.up { color: var(--green); }
  .user button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 6px 8px; border-radius: 999px; }
  .user button:hover { background: var(--raise); color: var(--text); }

  /* ===== Podium (3D) ===== */
  .stage {
    position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
    flex: 1 1 auto; min-height: 300px; background: #000; isolation: isolate;
  }
  .stage canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 7; transition: opacity .5s ease; }
  .flash.on { opacity: 1; transition: opacity .12s ease; }
  .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .letterbox::before, .letterbox::after { content: ''; position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 3; transition: height .6s ease; }
  .letterbox::before { top: 0; } .letterbox::after { bottom: 0; }
  .stage.cinema .letterbox::before, .stage.cinema .letterbox::after { height: 7%; }
  .letterbox { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

  /* Bovenbalk: fase + timer */
  .hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 12px;
    background: rgba(10, 8, 24, .62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px 6px 6px; pointer-events: none; transition: opacity .3s; }
  .ring { width: 44px; height: 44px; position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bgc { stroke: rgba(255,255,255,.1); }
  .ring .fgc { stroke: var(--gold); stroke-linecap: round; transition: stroke .3s; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ring.urgent .fgc { stroke: var(--red); }
  .ring.urgent b { color: var(--red); animation: pulse .5s ease infinite alternate; }
  @keyframes pulse { to { transform: scale(1.18); } }
  .phase-txt { display: flex; flex-direction: column; line-height: 1.15; }
  .phase-txt b { font-size: 15px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; }
  .phase-txt small { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* Geschiedenis rechtsboven */
  .hist { position: absolute; top: 8px; right: 14px; z-index: 8; display: flex; gap: 4px; flex-wrap: nowrap; max-width: 40%; overflow: hidden; padding: 8px 6px 2px 2px; pointer-events: none; }
  .hist span { flex: none; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 900;
    color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); position: relative; }
  .hist span i { position: absolute; top: -6px; right: -4px; font-style: normal; font-size: 9px; background: var(--gold); color: #1a1205; border-radius: 6px; padding: 0 3px; }
  .hist span:first-child { animation: histIn .5s ease; }
  @keyframes histIn { from { transform: scale(0); } }

  /* Knoppen linksboven */
  .stage-tools { position: absolute; top: 14px; left: 14px; z-index: 8; display: flex; gap: 6px; }
  .stage-tools button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: rgba(10,8,24,.62); backdrop-filter: blur(8px); cursor: pointer; display: grid; place-items: center; }
  .stage-tools button svg { width: 18px; height: 18px; }
  .stage-tools button:hover { background: rgba(40,32,80,.8); }

  /* Spreekballon van Stella */
  .bubble { --bc: rgba(185,140,255,.55); --bg1: rgba(30,20,64,.9); --bg2: rgba(12,9,30,.9); --tc: #b98cff;
    position: absolute; z-index: 9; left: 0; top: 0; max-width: min(270px, 52%); pointer-events: none;
    background: linear-gradient(160deg, var(--bg1), var(--bg2)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #f3efff; border: 1px solid var(--bc); border-radius: 13px; padding: 7px 11px 8px; font-size: 13px; font-weight: 650; line-height: 1.35; letter-spacing: .1px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 18px -6px var(--bc), inset 0 1px 0 rgba(255,255,255,.08);
    transform-origin: 30px 100%; opacity: 0; transition: opacity .25s ease; will-change: transform; }
  .bubble.show { opacity: 1; }
  /* Staartje: gedraaid vierkantje met dezelfde rand */
  .bubble::after { content: ''; position: absolute; left: 18px; bottom: -6px; width: 11px; height: 11px; transform: rotate(45deg);
    background: var(--bg2); border-right: 1px solid var(--bc); border-bottom: 1px solid var(--bc); border-bottom-right-radius: 3px; }
  .bubble .who { display: flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: 2px; font-weight: 900; color: var(--tc); margin-bottom: 2px; }
  .bubble .who::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff4fa3; box-shadow: 0 0 6px #ff4fa3; animation: onair 1.4s ease-in-out infinite; }
  @keyframes onair { 50% { opacity: .35; } }
  .bubble.mood-shock { --bc: rgba(242,193,78,.75); --bg1: rgba(64,44,12,.92); --tc: #f2c14e; }
  .bubble.mood-hype { --bc: rgba(255,79,163,.7); --bg1: rgba(70,18,60,.92); --tc: #ff8ac4; }
  .bubble.mood-sad { --bc: rgba(120,160,220,.55); --bg1: rgba(18,30,60,.9); --tc: #9fc0ff; }
  .bubble.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { scale: .7; opacity: 0; } }

  /* Grote uitslag */
  .banner { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 9; text-align: center; pointer-events: none; opacity: 0;
    background: rgba(8, 6, 22, .78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(242, 193, 78, .75); border-radius: 22px; padding: 18px 34px 20px; min-width: min(360px, 80%); max-width: 90%;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 40px rgba(242,193,78,.25), inset 0 0 30px rgba(242,193,78,.08); }
  .banner.lose { border-color: rgba(185,179,214,.5); box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  .banner.show { animation: bannerIn .7s cubic-bezier(.2,1.4,.4,1) forwards; }
  .banner.hide { animation: bannerOut .4s ease forwards; }
  @keyframes bannerIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-6deg); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes bannerOut { from { opacity: 1; } to { opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }
  .banner .big { font-size: clamp(36px, 7.5vw, 96px); font-weight: 1000; letter-spacing: -2px; line-height: .9;
    background: linear-gradient(180deg, #fff6c9, #f2c14e 50%, #c77b12); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.4)) drop-shadow(0 0 30px rgba(242,193,78,.6)); }
  .banner .sub { margin-top: 8px; font-size: clamp(14px, 2.2vw, 22px); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px #000; }
  .banner.lose .big { background: linear-gradient(180deg, #fff, #b9b3d6); -webkit-background-clip: text; background-clip: text; }

  /* Bonus-kiezers */
  .picker { position: absolute; z-index: 9; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; gap: 10px;
    background: rgba(10,8,24,.72); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
  .picker.show { display: flex; animation: slideUp .4s ease; }
  @keyframes slideUp { from { transform: translate(-50%, 30px); opacity: 0; } }
  .picker button { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 900; font-size: 15px; cursor: pointer; color: #fff; min-width: 96px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); transition: transform .1s; }
  .picker button:hover { transform: translateY(-2px); }
  .picker button.sel { outline: 3px solid #fff; outline-offset: 2px; }
  .picker .lbl { align-self: center; font-weight: 800; font-size: 13px; color: var(--muted); padding: 0 6px; }

  .huntgrid { position: absolute; z-index: 9; left: 50%; top: 52%; transform: translate(-50%, -50%); display: none;
    grid-template-columns: repeat(12, 1fr); gap: 4px; padding: 10px; width: min(760px, 94%);
    background: rgba(8,20,18,.72); backdrop-filter: blur(6px); border: 1px solid rgba(31,174,122,.5); border-radius: 14px; }
  .huntgrid.show { display: grid; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  .huntgrid button { aspect-ratio: 1.15; border: 0; border-radius: 6px; background: #12392e; cursor: crosshair; padding: 0; font-size: clamp(12px, 2.2vw, 20px); line-height: 1;
    display: grid; place-items: center; transition: transform .1s, background .1s; }
  .huntgrid button:hover { background: #1f6e55; transform: scale(1.12); z-index: 1; }
  .huntgrid button.mine { background: var(--gold); box-shadow: 0 0 0 2px #fff, 0 0 18px var(--gold); }
  .huntgrid .hint { grid-column: 1 / -1; text-align: center; font-weight: 900; letter-spacing: 1px; font-size: 13px; color: #9ff0cf; padding-bottom: 4px; }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 20; background: #05040c; color: var(--violet); font-weight: 900; letter-spacing: 4px; transition: opacity .6s; }
  .loading.gone { opacity: 0; pointer-events: none; }

  /* ===== Inzetbord ===== */
  .board { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .betpanel { padding: 10px 12px; }
  .spots { display: grid; grid-template-columns: repeat(4, 1fr) repeat(4, 1fr); gap: 8px; }
  .spot { position: relative; border: 0; border-radius: 12px; height: 76px; cursor: pointer; overflow: hidden; padding: 7px 6px 6px; color: #fff; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 85%, #fff 15%), color-mix(in srgb, var(--sc) 70%, #000 30%));
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.35); user-select: none;
    transition: transform .12s ease, filter .15s, box-shadow .2s, height .55s cubic-bezier(.2,.8,.2,1), padding .55s cubic-bezier(.2,.8,.2,1), border-radius .55s cubic-bezier(.2,.8,.2,1); }
  .spot:hover:not(:disabled) { transform: translateY(-3px); filter: brightness(1.1); }
  .spot:active:not(:disabled) { transform: translateY(0) scale(.97); }
  .spot:disabled { cursor: not-allowed; filter: saturate(.55) brightness(.75); }
  .spot .spot-ico { width: 30px; height: 30px; transition: width .55s cubic-bezier(.2,.8,.2,1), height .55s cubic-bezier(.2,.8,.2,1); display: block; margin: 0 auto; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
  .hist .hist-ico { width: 20px; height: 20px; }
  .huntgrid .hunt-ico { width: 72%; height: 72%; pointer-events: none; }
  .spot .v { transition: font-size .55s cubic-bezier(.2,.8,.2,1); font-size: 26px; font-weight: 1000; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .spot .n { max-height: 26px; overflow: hidden; transition: max-height .45s cubic-bezier(.2,.8,.2,1), opacity .3s ease, margin .45s cubic-bezier(.2,.8,.2,1); font-size: 10px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; line-height: 1.1; margin-top: 4px; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .spot .bonusname { font-size: clamp(8px, 0.85vw, 11px); font-weight: 1000; margin-top: 3px; white-space: nowrap; letter-spacing: -0.2px; }
  .spot .odds { display: none; }
  .spot .mychip { position: absolute; left: 6px; bottom: 6px; min-width: 30px; height: 30px; border-radius: 50%; display: none; place-items: center; font-size: 11px; font-weight: 900;
    background: repeating-conic-gradient(from 7deg, #fff 0 16deg, var(--gold) 16deg 45deg); color: #1a1205; box-shadow: 0 3px 6px rgba(0,0,0,.4); }
  .spot .mychip span { width: 72%; height: 72%; border-radius: 50%; display: grid; place-items: center; background: var(--gold); border: 1.5px dashed #fff; }
  .spot .mychip.on { display: grid; animation: chipIn .25s cubic-bezier(.3,1.7,.5,1); }
  @keyframes chipIn { from { transform: translateY(-20px) scale(.4); } }
  .spot .comet { position: absolute; top: 6px; right: 6px; background: #fff; color: #1a1205; font-weight: 1000; font-size: 13px; border-radius: 9px; padding: 3px 7px;
    box-shadow: 0 0 0 2px var(--gold), 0 0 18px #fff; display: none; }
  .spot .comet.on { display: block; animation: cometIn .6s cubic-bezier(.2,1.8,.4,1); }
  @keyframes cometIn { from { transform: scale(3) rotate(20deg); opacity: 0; } }
  .spot.win { animation: winGlow .5s ease infinite alternate; }
  @keyframes winGlow { to { box-shadow: 0 0 0 3px #fff, 0 0 30px var(--sc); } }
  .spot.c1 { --sc: var(--c1); } .spot.c2 { --sc: var(--c2); } .spot.c5 { --sc: var(--c5); } .spot.c10 { --sc: var(--c10); }
  .spot.ccoin { --sc: var(--ccoin); background: linear-gradient(135deg, #e8493a 0 50%, #2f6fe0 50% 100%); }
  .spot.cmeteor { --sc: var(--cmeteor); } .spot.chunt { --sc: var(--chunt); } .spot.cworm { --sc: var(--cworm); }

  .betbar { display: flex; align-items: center; gap: 10px; margin-top: 4px; padding-top: 4px; flex-wrap: wrap; max-height: 80px; overflow: hidden;
    transition: max-height .55s cubic-bezier(.2,.8,.2,1), opacity .35s ease, margin .55s cubic-bezier(.2,.8,.2,1), padding .55s cubic-bezier(.2,.8,.2,1); }
  .chips { display: flex; gap: 6px; }
  .chipbtn { width: 38px; height: 38px; border: 0; padding: 0; border-radius: 50%; cursor: pointer; font-weight: 900; font-size: 13px; display: grid; place-items: center;
    color: var(--ct); background: repeating-conic-gradient(from 7deg, var(--s) 0 16deg, var(--c) 16deg 45deg); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), 0 2px 4px rgba(0,0,0,.45);
    transition: transform .12s ease, box-shadow .12s ease; }
  .chipbtn > span { display: grid; place-items: center; width: 70%; height: 70%; border-radius: 50%; background: var(--c); border: 1.5px dashed var(--s); }
  .chipbtn:hover { transform: translateY(-2px); }
  .chipbtn.active { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--gold), 0 6px 14px rgba(0,0,0,.5); }
  .k1 { --c: #e3e5e9; --s: #8e98a5; --ct: #16181b; } .k5 { --c: #d9443a; --s: #fff; --ct: #fff; } .k10 { --c: #2f74e0; --s: #fff; --ct: #fff; }
  .k25 { --c: #26a157; --s: #fff; --ct: #fff; } .k100 { --c: #24262b; --s: var(--gold); --ct: var(--gold); }
  .tools { display: flex; gap: 6px; }
  .tools button { border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 800; cursor: pointer; }
  .tools button:hover:not(:disabled) { filter: brightness(1.25); }
  .tools button:disabled { opacity: .4; cursor: not-allowed; }
  .total { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); font-weight: 700; }
  .total b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
  .syncline { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 16px; max-height: 20px; overflow: hidden; transition: max-height .5s cubic-bezier(.2,.8,.2,1), opacity .3s, margin .5s cubic-bezier(.2,.8,.2,1); }
  .syncline.err { color: var(--red); }
  .login { text-align: center; padding: 18px 10px; }
  .login[hidden] { display: none; }
  .login h3 { margin: 0 0 8px; font-size: 17px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .login code { background: var(--raise); color: var(--text); padding: 2px 8px; border-radius: 6px; font-weight: 700; }

  .side { padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; contain: size; transition: padding .55s cubic-bezier(.2,.8,.2,1); }
  .betpanel { transition: padding .55s cubic-bezier(.2,.8,.2,1); }
  .side h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 2px; color: var(--muted); font-weight: 800; display: flex; justify-content: space-between; max-height: 20px; overflow: hidden; transition: max-height .5s cubic-bezier(.2,.8,.2,1), opacity .3s, margin .5s cubic-bezier(.2,.8,.2,1); }
  .players { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; scrollbar-width: thin; }
  .pl { display: flex; align-items: center; gap: 8px; background: var(--field); border: 0; border-radius: 9px; padding: 4px 9px 4px 5px; min-height: 32px; flex: none; animation: fadeIn .3s; }
  .pl > img { width: 24px; height: 24px; border-radius: 50%; background: var(--raise); flex: none; object-fit: cover; }
  .pl .nm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .pl .nm > span:first-child { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 30px; }
  .pl .btags { margin-top: 0; flex-wrap: nowrap; overflow: hidden; flex: 0 1 auto; }
  .pl .nm small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .pl .amt { font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .pl .amt.win { color: var(--green); } .pl .amt.loss { color: var(--red); }
  .pl.me { border-color: rgba(242,193,78,.5); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .mystats { flex: none; display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; max-height: 18px; transition: max-height .55s cubic-bezier(.2,.8,.2,1), opacity .35s, margin .55s cubic-bezier(.2,.8,.2,1); }
  .mystats b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 3px; }
  .mystats .win { color: var(--green); } .mystats .loss { color: var(--red); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--raise); border: 1px solid var(--line); border-radius: 12px;

  /* ===== Opstartscherm ===== */
  .intro { position: fixed; inset: 0; z-index: 1000; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 55%, #24124f 0%, #0d0824 45%, #030208 80%); }
  .intro::before { content: ''; position: absolute; inset: -30%; pointer-events: none;
    background: radial-gradient(circle at 25% 35%, rgba(110,50,190,.45), transparent 30%), radial-gradient(circle at 75% 30%, rgba(30,90,180,.4), transparent 28%),
      radial-gradient(circle at 55% 80%, rgba(190,50,140,.3), transparent 32%); filter: blur(14px); animation: ineb 16s ease-in-out infinite alternate; }
  @keyframes ineb { to { transform: rotate(10deg) scale(1.15); } }
  .intro .istars { position: absolute; left: 50%; top: 50%; width: 2px; height: 2px; border-radius: 50%; animation: iwarp 3s linear infinite; }
  .intro .istars.s2 { animation-delay: -1s; } .intro .istars.s3 { animation-delay: -2s; }
  @keyframes iwarp { from { transform: scale(.3); opacity: 0; } 15% { opacity: 1; } to { transform: scale(2.8); opacity: 0; } }
  .intro.out .istars { animation-duration: .45s; }
  .intro .istage { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 4vh, 36px); }

    animation: iin 1.1s cubic-bezier(.2,1.3,.3,1) .15s forwards; }
  @keyframes iin { to { opacity: 1; transform: none; } }
  .intro .irays { position: absolute; inset: -55%; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgba(242,193,78,.16) 0 6deg, transparent 6deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%); animation: irot 30s linear infinite; }
  .intro .iglow { position: absolute; inset: -12%; border-radius: 50%; background: radial-gradient(circle, rgba(185,140,255,.55), transparent 65%); animation: ipulse 2.4s ease-in-out infinite; }
  @keyframes ipulse { 50% { transform: scale(1.08); opacity: .7; } }
  .intro .iwheel { position: absolute; inset: 9%; width: 82%; height: 82%; filter: drop-shadow(0 0 22px rgba(242,193,78,.45)); animation: irot 9s linear infinite; }
  @keyframes irot { to { transform: rotate(360deg); } }
  .intro .iwheel .ib { animation: iblink .9s steps(2) infinite; } .intro .iwheel .ib:nth-child(2n) { animation-delay: .45s; }
  @keyframes iblink { 50% { opacity: .2; } }
  .intro .iring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .intro .iring circle { fill: none; stroke-linecap: round; }
  .intro .iring .rbg { stroke: rgba(255,255,255,.08); stroke-width: 1.2; }
  .intro .iring .rfg { stroke: url(#iringGrad); stroke-width: 1.8; stroke-dasharray: 301.6; stroke-dashoffset: 301.6; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);
    filter: drop-shadow(0 0 3px #f2c14e); }
  .intro .iorbit { position: absolute; inset: -16%; animation: irot 14s linear infinite reverse; }
  .intro .iorbit img { position: absolute; width: 16%; height: 16%; left: 42%; top: 42%; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
    transform: rotate(calc(var(--i) * 90deg)) translateY(-330%) rotate(calc(var(--i) * -90deg)); }

    filter: drop-shadow(0 5px 0 #3a1d00) drop-shadow(0 0 30px rgba(242,193,78,.5));

  .intro .ilogo::after { content: ''; position: absolute; inset: -10% -4%; pointer-events: none;

<body>
<script src="/connection.js?v=11"></script>
<div class="intro" id="intro" aria-hidden="true">
  <div class="istars"></div><div class="istars s2"></div><div class="istars s3"></div>
  <div class="istage">
    <div class="iemblem">
      <div class="irays"></div>
      <div class="iglow"></div>
      <svg class="iwheel" id="introWheel" viewBox="-110 -110 220 220"></svg>
      <svg class="iring" viewBox="0 0 100 100"><defs><linearGradient id="iringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c9"/><stop offset="1" stop-color="#e8a21a"/></linearGradient></defs>
        <circle class="rbg" cx="50" cy="50" r="48"/><circle class="rfg" id="introRing" cx="50" cy="50" r="48"/></svg>
      <div class="iorbit" id="introBonus"></div>
    </div>
    <div class="ilogo" id="introLogo"></div>
  </div>
  <div class="iflash"></div>
</div>
<script>
  // Opstartscherm direct tekenen (nog voor het zware 3D-script): sterren, rad en letters
  (() => {
    const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
    document.querySelectorAll('.intro .istars').forEach(layer => {
      const pts = [];
      for (let i = 0; i < 160; i++) {
        const a = rnd() * Math.PI * 2, r = 40 + rnd() * 700, sz = rnd() < 0.85 ? 1 : 2;
        pts.push(`${Math.round(Math.cos(a) * r)}px ${Math.round(Math.sin(a) * r * 0.62)}px 0 ${sz - 1}px rgba(255,255,255,${(0.4 + rnd() * 0.6).toFixed(2)})`);
      }
      layer.style.boxShadow = pts.join(',');
    });
    const colors = ['#23b5c9', '#f0a92e', '#23b5c9', '#d9439a', '#23b5c9', '#6fcf3d', '#f0a92e', '#e8493a', '#23b5c9', '#ff7a2a', '#f0a92e', '#1fae7a', '#8a4dff'];
    const n = 54, R = 92;
    let svg = '<defs><radialGradient id="iwg"><stop offset=".25" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>';
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2, f = v => v.toFixed(2);
      svg += `<path d="M0 0L${f(Math.cos(a0) * R)} ${f(Math.sin(a0) * R)}A${R} ${R} 0 0 1 ${f(Math.cos(a1) * R)} ${f(Math.sin(a1) * R)}Z" fill="${colors[i % colors.length]}" stroke="#ffe9a8" stroke-width=".4"/>`;
    }
    svg += `<circle r="${R}" fill="url(#iwg)"/><circle r="${R + 5}" fill="none" stroke="#d9a640" stroke-width="6"/><circle r="22" fill="#140f2a" stroke="#d9a640" stroke-width="3"/>`;
    for (let i = 0; i < 40; i++) { const a = (i / 40) * Math.PI * 2; svg += `<circle class="ib" cx="${(Math.cos(a) * (R + 5)).toFixed(2)}" cy="${(Math.sin(a) * (R + 5)).toFixed(2)}" r="2.2" fill="#fff3c4"/>`; }
    document.getElementById('introWheel').innerHTML = svg;
    document.getElementById('introLogo').innerHTML = [...'STERRENRAD'].map((ch, i) => `<span style="--i:${i}">${ch}</span>`).join('');
  })();
</script>

function drawWheelFace(segments, colorOf, labelOf, { size = 2048, hub = '#1a1530', font = 1 } = {}) {
  const c = makeCanvas(size, size), g = c.getContext('2d'), cx = size / 2, R = size / 2 - 4, n = segments.length, seg = TAU / n;
  for (let i = 0; i < n; i++) {

    const mid = -Math.PI / 2 + i * seg, a0 = mid - seg / 2, a1 = mid + seg / 2;
    const col = colorOf(segments[i], i);
    const grad = g.createRadialGradient(cx, cx, R * 0.25, cx, cx, R);
    if (Array.isArray(col)) { grad.addColorStop(0, col[0]); grad.addColorStop(1, col[1]); }
    else { grad.addColorStop(0, shade(col, -0.45)); grad.addColorStop(0.7, col); grad.addColorStop(1, shade(col, 0.25)); }

    g.strokeStyle = 'rgba(255,222,150,.9)'; g.lineWidth = size / 900; g.stroke();

  g.strokeStyle = 'rgba(10,6,24,.55)'; g.lineWidth = R * 0.02; g.beginPath(); g.arc(cx, cx, R * 0.99, 0, TAU); g.stroke();

function buildWheel({ segments, radius, colorOf, labelOf, bulbs, pointerAngles, pointerColors, logo, size = 2048 }) {

  g.fillStyle = '#f2c14e'; g.font = `1000 ${face.width * Math.min(0.034, 0.22 / logo.length)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';

  const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), Math.PI / 2);
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 - (i + 0.5) * seg; // grens tussen vak i en i+1 (met de klok mee)
    m.compose(V(Math.cos(a) * radius * 0.985, Math.sin(a) * radius * 0.985, 0.3), q, V(1, 1, 1));
    pegs.setMatrixAt(i, m);
  }
  spinner.add(pegs);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.2, radius * 0.24, 0.5, 48), goldMat);
  hub.rotation.x = Math.PI / 2; hub.position.z = 0.25; spinner.add(hub);
  const hubCap = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.19, 48), new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.62, metalness: 0 }));
  // Naafkap: laat het midden van de textuur zien
  hubCap.geometry.attributes.uv.array.forEach((v, i, arr) => { arr[i] = 0.5 + (v - 0.5) * 0.19 / 1; });
  hubCap.position.z = 0.51; spinner.add(hubCap);
  // Gouden rand met lampjes (draait niet mee)
  const rim = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.06, radius * 0.045, 16, 160), goldMat);
  rim.position.z = 0.1; group.add(rim);
  const bulbGeo = new THREE.SphereGeometry(radius * 0.022, 10, 8);
  const bulbMesh = new THREE.InstancedMesh(bulbGeo, new THREE.MeshBasicMaterial({ color: '#ffffff' }), bulbs);
  for (let i = 0; i < bulbs; i++) {
    const a = i / bulbs * TAU;
    m.makeTranslation(Math.cos(a) * radius * 1.06, Math.sin(a) * radius * 1.06, radius * 0.05);
    bulbMesh.setMatrixAt(i, m);
    bulbMesh.setColorAt(i, new THREE.Color('#ffd27a'));
  }
  group.add(bulbMesh);
  // Wijzers
  // Wijzer: druppelvorm met afgeronde randen, scharnier bovenaan
  const tear = new THREE.Shape();
  tear.moveTo(0, -1); tear.bezierCurveTo(0.32, -0.5, 0.58, 0.05, 0.58, 0.35); tear.absarc(0, 0.35, 0.58, 0, Math.PI, false); tear.bezierCurveTo(-0.58, 0.05, -0.32, -0.5, 0, -1);
  const tearGeo = new THREE.ExtrudeGeometry(tear, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.07, bevelSegments: 8, curveSegments: 48 });
  tearGeo.translate(0, -0.35, -0.11);
  const pointers = pointerAngles.map((ang, i) => {
    const pivot = new THREE.Group();
    pivot.position.set(Math.sin(ang) * radius * 1.1, Math.cos(ang) * radius * 1.1, 0.5);
    pivot.rotation.z = -ang;
    const col = pointerColors[i];
    const arm = new THREE.Group(); pivot.add(arm);
    const sc = radius * 0.1;
    const body = new THREE.Mesh(tearGeo, i === 0 && pointerAngles.length === 1 ? goldMat : new THREE.MeshStandardMaterial({ color: col, metalness: 0.75, roughness: 0.22 }));

    gem.position.z = 0.2 * sc; gem.scale.z = 0.6;
    arm.add(body, rim, gem);
    group.add(pivot);
    return { pivot, arm, flap: 0 };

  return { group, spinner, bulbMesh, bulbs, pointers, n, seg, faceTex, angle: 0 };
}

function animateBulbs(w, t, mode) {

    if (mode === 'chase') v = (Math.sin(i * 0.9 - t * 14) > 0.3) ? 1 : 0.25;
    else if (mode === 'flash') v = Math.floor(t * 6) % 2 ? 1 : 0.2;
    else if (mode === 'win') v = (i + Math.floor(t * 10)) % 3 === 0 ? 1 : 0.3;

    c.setHSL(mode === 'win' ? (i / w.bulbs + t * 0.3) % 1 : 0.11, mode === 'win' ? 0.85 : 0.9, 0.28 + v * 0.34);
    w.bulbMesh.setColorAt(i, c);
  }
  w.bulbMesh.instanceColor.needsUpdate = true;
}

      g.fillStyle = '#120a08'; g.beginPath(); g.moveTo(x + side * (w - 3), ey - 4); g.lineTo(x + side * (w + 9), ey - 10); g.lineTo(x + side * (w - 1), ey + 1); g.closePath(); g.fill();

      for (let k = 0; k < 7; k++) {

      }

      // Ooglidplooi

      g.beginPath(); g.moveTo(x - w * 0.85, ey - top * 0.9); g.quadraticCurveTo(x, ey - top * 1.75, x + w * 0.9, ey - top * 0.9); g.stroke();
    }
    // Mond: echte lippen in plaats van een lijntje
    const talk = faceState.talk > 0 ? (Math.sin(t * 19) * 0.5 + 0.5) * (0.6 + Math.sin(t * 7.3) * 0.4) : 0;
    const my = 214, lipU = '#b8283f', lipL = '#d23a52';
    const lipsClosed = curve => {
      // bovenlip met cupidoboog
      g.fillStyle = lipU; g.beginPath(); g.moveTo(101, my - curve); g.quadraticCurveTo(115, my - 13, 124, my - 11); g.quadraticCurveTo(128, my - 8, 132, my - 11); g.quadraticCurveTo(141, my - 13, 155, my - curve);
      g.quadraticCurveTo(128, my + 1 - curve * 0.2, 102, my - curve); g.fill();
      // onderlip

    };

      g.fillStyle = '#3a1210'; g.beginPath(); g.moveTo(L, my - 4); g.quadraticCurveTo(128, my - 9, R, my - 4); g.quadraticCurveTo(128, my + h * 1.5, L, my - 4); g.fill();
      g.save(); g.clip();

      g.fillStyle = '#b0444a'; g.beginPath(); g.ellipse(128, my + h * 1.1, 14 * wide, 7, 0, 0, TAU); g.fill(); // tong
      g.restore();
      g.strokeStyle = lipU; g.lineWidth = 4; g.beginPath(); g.moveTo(L, my - 4); g.quadraticCurveTo(128, my - 10, R, my - 4); g.stroke();
      g.strokeStyle = lipL; g.lineWidth = 5; g.beginPath(); g.moveTo(L + 2, my - 3); g.quadraticCurveTo(128, my + h * 1.5 + 3, R - 2, my - 3); g.stroke();

    if (m === 'shock') {

const particles = (() => {
  const N = 3000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), vel = new Float32Array(N * 3), life = new Float32Array(N), maxLife = new Float32Array(N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.16, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false;
  scene.add(pts);
  for (let i = 0; i < N; i++) pos[i * 3 + 1] = -9999;
  let next = 0;
  const c = new THREE.Color();
  return {
    burst(at, { count = 120, speed = 6, colors = ['#ffd27a', '#ff7ad9', '#4fd1ff'], up = 0, gravity = 1, lifeS = 1.4 } = {}) {
      for (let k = 0; k < count; k++) {
        const i = next; next = (next + 1) % N;
        const u = Math.random() * 2 - 1, th = Math.random() * TAU, s = Math.sqrt(1 - u * u), sp = speed * (0.3 + Math.random() * 0.7);
        pos.set([at.x, at.y, at.z], i * 3);
        vel.set([Math.cos(th) * s * sp, u * sp + up, Math.sin(th) * s * sp], i * 3);
        c.set(colors[k % colors.length]); col.set([c.r, c.g, c.b], i * 3);
        life[i] = maxLife[i] = lifeS * (0.6 + Math.random() * 0.6);
        vel[i * 3 + 1] += 0; maxLife[i] *= 1; life[i] = maxLife[i]; pts.userData.g = gravity;
      }
    },
    update(dt) {
      const g = pts.userData.g || 1;
      for (let i = 0; i < N; i++) {
        if (life[i] <= 0) continue;
        life[i] -= dt;
        if (life[i] <= 0) { pos[i * 3 + 1] = -9999; continue; }
        vel[i * 3 + 1] -= 6 * g * dt;
        vel[i * 3] *= 0.985; vel[i * 3 + 2] *= 0.985;
        pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        const f = life[i] / maxLife[i];
        col[i * 3] *= 0.995; col[i * 3 + 1] *= 0.995; col[i * 3 + 2] *= 0.995 + f * 0.004;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
    }
  };
})();

// Kometen die door de lucht naar de balk vliegen
const comets3d = [];
function launchComet(spot, mult, landAt) {
  const target = tilePos(spot);
  const from = target.clone().add(V((Math.random() - 0.5) * 60, 30 + Math.random() * 15, -60 - Math.random() * 30));
  const head = new THREE.Group();
  head.add(glow('#ffffff', 1.6, 1), glow(mult >= 10 ? '#ffcf3a' : '#7fd6ff', 5, 0.8));
  const tail = Array.from({ length: 16 }, (_, i) => { const t = glow(mult >= 10 ? '#ffb347' : '#6fc8ff', 2.6 - i * 0.13, 0.5 - i * 0.028); scene.add(t); return t; });
  scene.add(head);
  const c = { spot, mult, from, target, head, tail, hist: [], start: landAt - 700, end: landAt, done: false };
  comets3d.push(c);
  sfx.whoosh();
}
function updateComets(now) {
  for (const c of comets3d) {
    if (c.done) continue;
    const p = clamp((now - c.start) / (c.end - c.start), 0, 1), e = p * p;
    const pos = c.from.clone().lerp(c.target, e);
    pos.y += Math.sin(p * Math.PI) * 3;
    c.head.position.copy(pos);
    c.hist.unshift(pos.clone()); if (c.hist.length > 16) c.hist.pop();
    c.tail.forEach((t, i) => { const h = c.hist[Math.min(i * 1, c.hist.length - 1)]; t.position.copy(h); });
    if (p >= 1) {
      c.done = true;
      scene.remove(c.head); c.tail.forEach(t => scene.remove(t));
      const tile = cometBoard.tiles[c.spot];
      tile.mult = c.mult; tile.pulse = 1; tile.draw();
      particles.burst(c.target, { count: c.mult >= 10 ? 260 : 140, speed: c.mult >= 10 ? 9 : 6, colors: ['#ffffff', '#ffe27a', SEG_COLORS[c.spot]] });
      sfx.boom(c.mult >= 10);
      shake(c.mult >= 10 ? 0.5 : 0.25);
      if (c.mult >= 10) flash();
      renderSpots();
    }
  }
}
function resetComets() {
  for (const c of comets3d) { scene.remove(c.head); c.tail.forEach(t => scene.remove(t)); }
  comets3d.length = 0;
  for (const tile of Object.values(cometBoard.tiles)) { if (tile.mult) { tile.mult = null; tile.draw(); } }
}

const sfx = (() => {
  let ctx = null, master = null, muted = false;
  try { muted = localStorage.getItem('sterrenrad_muted') === '1'; } catch (error) { /* geen opslag */ }
  const ensure = () => {
    if (ctx) return ctx;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ctx.destination); } catch (error) { ctx = null; }
    return ctx;
  };
  addEventListener('pointerdown', () => { ensure(); if (ctx && ctx.state === 'suspended') ctx.resume(); });
  const tone = (f, dur, { type = 'sine', vol = 0.3, to = null, delay = 0, attack = 0.005 } = {}) => {
    if (!ensure() || muted) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  const noise = (dur, { vol = 0.3, from = 2000, to = 200, delay = 0, q = 1 } = {}) => {
    if (!ensure() || muted) return;
    const t = ctx.currentTime + delay, len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(master); src.start(t);
  };
  let lastTick = 0;
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('sterrenrad_muted', muted ? '1' : '0'); } catch (error) { /* geen opslag */ } if (master) master.gain.value = muted ? 0 : 0.5; },
    tick() { const n = performance.now(); if (n - lastTick < 28) return; lastTick = n; tone(1800 + Math.random() * 300, 0.03, { type: 'square', vol: 0.06 }); },
    chip() { tone(1200, 0.06, { type: 'triangle', vol: 0.18 }); tone(1600, 0.05, { type: 'triangle', vol: 0.12, delay: 0.03 }); },
    whoosh() { noise(0.7, { vol: 0.25, from: 400, to: 3000, q: 0.7 }); },
    boom(big) { tone(big ? 70 : 110, 0.6, { type: 'sine', vol: 0.5, to: 35 }); noise(0.4, { vol: 0.3, from: 1500, to: 100 }); if (big) [0, 0.08, 0.16].forEach((d, i) => tone(660 * (i + 2), 0.3, { type: 'triangle', vol: 0.12, delay: d + 0.1 })); },
    spin() { tone(200, 0.8, { type: 'sawtooth', vol: 0.08, to: 800 }); noise(1, { vol: 0.15, from: 300, to: 2500 }); },
    land() { [523, 659, 784].forEach((f, i) => tone(f, 0.4, { type: 'triangle', vol: 0.2, delay: i * 0.07 })); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, { type: 'triangle', vol: 0.22, delay: i * 0.09 })); tone(1568, 0.9, { type: 'sine', vol: 0.15, delay: 0.5 }); },
    bigwin() { for (let k = 0; k < 3; k++) [523, 659, 784, 1047].forEach((f, i) => tone(f * (1 + k * 0.25), 0.35, { type: 'square', vol: 0.09, delay: k * 0.4 + i * 0.07 })); },
    lose() { tone(330, 0.35, { type: 'triangle', vol: 0.15, to: 220 }); tone(247, 0.5, { type: 'triangle', vol: 0.12, delay: 0.25, to: 160 }); },
    bonus() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, { type: 'square', vol: 0.1, delay: i * 0.06 })); noise(1.2, { vol: 0.2, from: 200, to: 6000, delay: 0.3 }); },
    laser() { tone(1400, 0.18, { type: 'square', vol: 0.07, to: 200 }); },
    double() { [440, 554, 659, 880, 1109, 1319].forEach((f, i) => tone(f, 0.25, { type: 'sawtooth', vol: 0.08, delay: i * 0.05 })); },
    portal() { tone(60, 2.5, { type: 'sawtooth', vol: 0.12, to: 400 }); noise(2.5, { vol: 0.25, from: 100, to: 5000, q: 0.5 }); },
    flip() { for (let i = 0; i < 14; i++) tone(900 + i * 40, 0.04, { type: 'square', vol: 0.05, delay: i * 0.12 + Math.random() * 0.03 }); },
    drum() { for (let i = 0; i < 20; i++) noise(0.06, { vol: 0.12 + i * 0.008, from: 900, to: 300, delay: i * 0.07 }); },
    blip() { tone(880, 0.08, { type: 'sine', vol: 0.12 }); },
    peg(n) { tone(520 + n * 75, 0.08, { type: 'triangle', vol: 0.13 }); tone(2100 + n * 60, 0.03, { type: 'square', vol: 0.035 }); },
    rumble() { noise(2.6, { vol: 0.32, from: 120, to: 2400, q: 0.6 }); tone(48, 2.6, { type: 'sawtooth', vol: 0.09, to: 140 }); }
  };
})();

let shakeAmt = 0;

function flash() { const f = $('flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 120); }
// Confetti in 2D over het beeld (voor je eigen winst)
const confetti = [];
function popConfetti(n = 160) {
  const W = fxCanvas.width, H = fxCanvas.height;
  for (let i = 0; i < n; i++) confetti.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.45, vx: (Math.random() - 0.5) * W * 0.02, vy: -Math.random() * H * 0.03 - H * 0.008,
    r: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4, s: 6 + Math.random() * 8, c: ['#f2c14e', '#ff7ad9', '#4fd1ff', '#7cf06b', '#fff'][i % 5], life: 1 });
}
function drawConfetti(dt) {
  fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.vy += fxCanvas.height * 0.0009; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= dt * 0.35;
    if (p.life <= 0 || p.y > fxCanvas.height + 20) { confetti.splice(i, 1); continue; }
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r); fx.globalAlpha = Math.min(1, p.life * 2); fx.fillStyle = p.c; fx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fx.restore();
  }
}

let clockOffset = 0;
const clockSamples = [];
function addClockSample(sample) { clockSamples.push(sample); if (clockSamples.length > 12) clockSamples.shift(); clockOffset = Math.max(...clockSamples); }
const now = () => Date.now() + clockOffset;
const sumBets = b => Object.values(b).reduce((a, v) => a + v, 0);

function phaseKey() {
  const r = rnd();
  if (!r || r.phase === 'cancelled') return 'open';
  if (r.phase === 'betting') return now() < r.bettingEndsAt - 250 ? 'betting' : 'closing';
  if (r.phase === 'result') return now() < r.nextAt ? 'result' : 'open';
  return r.phase;
}
const canEdit = () => linked() && ['open', 'betting'].includes(phaseKey());

  } catch (error) { toast('Geen verbinding met de server.', true); return; }
  const first = !cfg;
  cfg = me.config;
  if (me.linked && !dirty && !syncing) balance = me.balance;

  if (first) {

  $('login').hidden = linked();
}

addEventListener('focus', () => { if (me && !dirty && !syncing) loadStatus(); });

}

  syncing = false;

// =====================================================
// INZETTEN
// =====================================================
function addChip(spot) {
  if (!linked()) { toast('Typ /sterrenrad in Discord om mee te spelen.', true); return; }
  if (!canEdit()) { toast('De inzetten zijn gesloten.', true); return; }
  const chip = settings.chip;
  if (sumBets(myBets) + chip > cfg.maxTotalBet) { toast(`Maximaal ${cfg.maxTotalBet} punten per ronde.`, true); return; }
  if (shownBalance() < chip) { toast('Niet genoeg punten.', true); return; }
  undoStack.push({ ...myBets });
  myBets[spot] = (myBets[spot] || 0) + chip;
  sfx.chip();
  bumpSpot(spot);
  scheduleSync(); renderSpots(); renderBalance();
}
function removeChip(spot) {
  if (!canEdit() || !myBets[spot]) return;
  undoStack.push({ ...myBets });
  myBets[spot] = Math.max(0, myBets[spot] - settings.chip);
  if (!myBets[spot]) delete myBets[spot];
  scheduleSync(); renderSpots(); renderBalance();
}
function setBets(next) {
  if (!canEdit()) return;
  const total = sumBets(next);
  if (total > cfg.maxTotalBet) { toast(`Maximaal ${cfg.maxTotalBet} punten per ronde.`, true); return; }
  if (total - sumBets(confirmed) > balance) { toast('Niet genoeg punten.', true); return; }
  undoStack.push({ ...myBets });
  myBets = next;
  sfx.chip();
  scheduleSync(); renderSpots(); renderBalance();
}

// RADANIMATIE
// =====================================================
let wheelAnim = null;      // { round, from, to, start, end }

function spinAngle(anim, t) {
  const p = clamp((t - anim.start) / (anim.end - anim.start), 0, 1);

}

}
function updateWheels(t, dt) {
  const r = rnd();
  if (mainWheel) {
    if (r && r.segIndex !== null && r.spinStartAt && (!wheelAnim || wheelAnim.round !== r.id)) {
      const from = mainWheel.angle;
      wheelAnim = { round: r.id, from, to: targetAngle(from, r.segIndex, mainWheel.seg, 5), start: r.spinStartAt, end: r.landAt };
      if (t > r.landAt) mainWheel.angle = wheelAnim.to;
      else sfx.spin();
    }
    if (wheelAnim && t <= wheelAnim.end + 50) mainWheel.angle = spinAngle(wheelAnim, t);
    else if (!wheelAnim || phaseKey() === 'open') mainWheel.angle += dt * 0.04; // rustig draaien als er niks gebeurt
    mainWheel.spinner.rotation.z = mainWheel.angle;
    flapPointer(mainWheel, mainWheel.angle, 'main');
    const pk = phaseKey();
    animateBulbs(mainWheel, t / 1000, pk === 'spinning' ? 'chase' : pk === 'landed' || pk === 'result' ? 'win' : pk === 'closing' || pk === 'comets' ? 'flash' : 'idle');
  }

    if (b && b.type === 'worm' && b.spins && (!wormAnim || wormAnim.round !== r.id)) {
      let from = wormWheel.angle;
      const steps = b.spins.map((s, i) => {
        const start = b.spinStartAt + i * (cfg.wormSpinMs + cfg.wormBetweenMs);
        const to = targetAngle(from, s.offset, wormWheel.seg, 3);
        const st = { from, to, start, end: start + cfg.wormSpinMs };
        from = to; return st;
      });
      wormAnim = { round: r.id, steps };

      wormWheel.angle = t < step.start ? step.from : spinAngle(step, t);
    } else wormWheel.angle += dt * 0.05;
    wormWheel.spinner.rotation.z = wormWheel.angle;

    s.style.background = x.seg === 'coin' ? 'linear-gradient(135deg,#e8493a 50%,#2a62d8 50%)' : SEG_COLORS[x.seg];
    if (x.mult) s.append(el('i', { text: `×${x.mult}` }));
    return s;
  }));
}
function renderPicker() {
  const r = rnd(), b = r && r.bonus, mine = myEntry(), picker = $('picker'), grid = $('huntgrid');
  const playing = b && mine && mine.bets[b.type];
  const wormPick = playing && b.type === 'worm' && ['travel', 'portal', 'pick'].includes(b.stage);
  picker.classList.toggle('show', Boolean(wormPick));
  if (wormPick) {
    picker.replaceChildren(el('span', { class: 'lbl', text: 'Jouw wijzer:' }), ...cfg.wormPointerNames.map((name, i) => {
      const btn = el('button', { text: name, class: myChoice === i ? 'sel' : '', onclick: () => choose(i) });
      btn.style.background = WORM_COLORS[i]; if (i === 2) btn.style.color = '#2a1a00';
      return btn;
    }));
  }
  const huntPick = playing && b.type === 'hunt' && ['shuffle', 'pick'].includes(b.stage) && b.symbols;
  grid.classList.toggle('show', Boolean(huntPick));
  if (huntPick && grid.dataset.round !== r.id) {
    grid.dataset.round = r.id;
    grid.replaceChildren(el('div', { class: 'hint', text: 'KIES JE DOEL — elk symbool verbergt een multiplier' }),
      ...b.symbols.map((sym, i) => el('button', { 'data-i': i, onclick: () => choose(i) }, [iconImg(sym, 'hunt-ico')])));
  }
  if (huntPick) grid.querySelectorAll('button').forEach(btn => btn.classList.toggle('mine', Number(btn.dataset.i) === myChoice));
}
async function choose(i) {
  myChoice = i; renderPicker(); sfx.blip();
  const res = await post('/api/sterrenrad/choose', { choice: i });
  if (!res.ok) toast(res.message, true);
}

// HUD bovenaan
const BONUS_STAGE_TXT = {
  travel: 'Op weg naar de bonus…', reveal: 'De kanten worden geladen', flip: 'De munt vliegt!', setup: 'Stella pakt een meteoor',
  drop: 'De meteoor valt!', shuffle: 'De doelen worden geschud', pick: 'Kies!', portal: 'Door het portaal!', spin: 'Het reuzenrad draait', done: 'Uitslag!'
};
function renderHud(t) {
  const r = rnd(), pk = phaseKey();
  let title = 'Sterrenrad', sub = '', fill = 0, num = '', urgent = false;
  if (pk === 'open') { title = 'Leg je fiches'; sub = linked() ? 'De eerste fiche start de ronde' : 'Kijk mee of typ /sterrenrad'; num = '•'; }
  else if (pk === 'betting' || pk === 'closing') {
    const left = Math.max(0, r.bettingEndsAt - t);
    title = 'Inzetten!'; sub = `${r.players.length} speler${r.players.length === 1 ? '' : 's'} aan boord`; num = Math.ceil(left / 1000); fill = left / cfg.bettingMs; urgent = left < 5000;
  } else if (pk === 'comets') { title = 'Kometen!'; sub = 'Multipliers vallen uit de lucht'; num = '!'; fill = 1; }
  else if (pk === 'spinning') { title = 'Het rad draait'; sub = 'Duimen maar…'; num = '…'; fill = 1 - clamp((t - r.spinStartAt) / cfg.spinMs, 0, 1); }
  else if (pk === 'landed') { title = /^\d+$/.test(r.segment) ? `Het is ${r.segment}!` : BONUS_TITLE[r.segment]; sub = 'Uitbetalen…'; num = '•'; }
  else if (pk === 'bonus' && r.bonus) {
    const b = r.bonus, mine = myEntry();
    title = BONUS_TITLE[b.type];
    sub = (b.type === 'hunt' && b.stage === 'reveal') ? 'Vuur! De doelen gaan open' : BONUS_STAGE_TXT[b.stage] || '';
    if (b.stage === 'pick' && !(mine && mine.bets[b.type])) sub = 'Je speelt niet mee — kijk mee!';
    if (b.stageEndsAt) { const left = Math.max(0, b.stageEndsAt - t); num = Math.ceil(left / 1000); fill = left / Math.max(1, b.stageEndsAt - b.stageAt); urgent = b.stage === 'pick' && left < 4000; }
    else num = '!';
  } else if (pk === 'result') { title = 'Uitslag'; const left = Math.max(0, r.nextAt - t); sub = `Volgende ronde over ${Math.ceil(left / 1000)}s`; num = Math.ceil(left / 1000); fill = left / cfg.resultMs; }
  appEl.classList.toggle('show-mode', !['open', 'betting', 'closing'].includes(pk));
  $('phaseTitle').textContent = title; $('phaseSub').textContent = sub; $('ringNum').textContent = num;
  $('ringFg').style.strokeDashoffset = String(119.4 * (1 - clamp(fill, 0, 1)));
  $('ring').classList.toggle('urgent', urgent);
  if (urgent && pk === 'betting' && Math.ceil((r.bettingEndsAt - t) / 1000) !== renderHud.lastSec) { renderHud.lastSec = Math.ceil((r.bettingEndsAt - t) / 1000); sfx.blip(); }
}

// Ballon boven Stella's hoofd
const bubblePos = { x: 16, y: 300, docked: true, init: false };
function placeBubble() {
  const box = $('bubble');
  pumpSpeech();
  if (performance.now() > bubbleHideAt) { box.classList.remove('show'); return; }
  const p = astro.headWorld().add(V(0, 0.7, 0)).project(camera);
  const W = stageEl.clientWidth, H = stageEl.clientHeight, bw = box.offsetWidth, bh = box.offsetHeight;
  let x = (p.x * 0.5 + 0.5) * W - 26, y = (-p.y * 0.5 + 0.5) * H - bh - 14;
  const visible = p.z < 1 && x > -bw * 0.3 && x < W - 40 && y > -bh && y < H - bh;
  if (!visible) { x = 16; y = H - bh - 18; }
  x = clamp(x, 10, W - bw - 10); y = clamp(y, 64, H - bh - 10);
  // Zacht meebewegen; bij wisselen tussen hoofd en hoek in één keer
  if (!bubblePos.init || bubblePos.docked !== !visible) { bubblePos.x = x; bubblePos.y = y; bubblePos.docked = !visible; bubblePos.init = true; }
  else { bubblePos.x = lerp(bubblePos.x, x, 0.08); bubblePos.y = lerp(bubblePos.y, y, 0.08); }
  // Nooit buiten het beeld (de ballon wordt breder terwijl de tekst verschijnt)
  bubblePos.x = clamp(bubblePos.x, 10, W - bw - 10); bubblePos.y = clamp(bubblePos.y, 64, H - bh - 10);
  box.style.transform = `translate(${Math.round(bubblePos.x)}px, ${Math.round(bubblePos.y)}px)`;
}

let toastTimer = null;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = `toast show${bad ? ' bad' : ''}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, bad ? 3800 : 2400);
}

// Knoppen op het podium
const ICONS = {
  on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h12v10H3z"/><path d="M15 10l6-3v10l-6-3"/></svg>',
  fixed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>',
  fsIn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>',
  fsOut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>'
};
// Volledig scherm (met terugval voor browsers zonder Fullscreen API, zoals iPhone Safari)
const appEl = document.querySelector('.app');
const isFull = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement) || appEl.classList.contains('pseudo-fs');
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else if (appEl.classList.contains('pseudo-fs')) appEl.classList.remove('pseudo-fs');
    else if (appEl.requestFullscreen || appEl.webkitRequestFullscreen) { await (appEl.requestFullscreen || appEl.webkitRequestFullscreen).call(appEl); }
    else appEl.classList.add('pseudo-fs');
  } catch (error) { appEl.classList.toggle('pseudo-fs'); }
  renderTools();
}
document.addEventListener('fullscreenchange', () => renderTools());
// Pc: bij de eerste klik op de pagina meteen volledig scherm. Eén keer per keer laden, dus na Esc blijft het gewoon klein.
const isDesktop = !matchMedia('(pointer: coarse)').matches && !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
if (isDesktop && (appEl.requestFullscreen || appEl.webkitRequestFullscreen)) {
  const autoFullscreen = e => {
    removeEventListener('click', autoFullscreen, true);
    // Niet bij de fullscreen-knop zelf of bij links naar een andere pagina
    if (e.target.closest && e.target.closest('#fsBtn, header a, .vn-panel, .user button')) return;
    if (!isFull()) toggleFullscreen();
  };
  addEventListener('click', autoFullscreen, true);
}
document.addEventListener('webkitfullscreenchange', () => renderTools());
addEventListener('keydown', e => {
  if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey && !/input|textarea/i.test(e.target.tagName)) toggleFullscreen();
  if (e.key === 'Escape' && appEl.classList.contains('pseudo-fs')) { appEl.classList.remove('pseudo-fs'); renderTools(); }
});
function renderTools() {
  $('muteBtn').innerHTML = sfx.muted ? ICONS.off : ICONS.on;
  $('camBtn').innerHTML = autoCam ? ICONS.auto : ICONS.fixed;
  $('camBtn').title = autoCam ? 'Camera: automatisch (klik voor vast)' : 'Camera: vast (klik voor automatisch)';
  $('fsBtn').innerHTML = isFull() ? ICONS.fsOut : ICONS.fsIn;
  $('fsBtn').title = isFull() ? 'Volledig scherm verlaten (F)' : 'Volledig scherm (F)';
}
$('fsBtn').onclick = toggleFullscreen;
$('muteBtn').onclick = () => { sfx.toggle(); renderTools(); };
$('camBtn').onclick = () => { autoCam = !autoCam; try { localStorage.setItem('sterrenrad_cam', autoCam ? 'auto' : 'fixed'); } catch (error) { /* geen opslag */ } shotKey = ''; renderTools(); toast(autoCam ? 'Camera volgt de show' : 'Vaste camera'); };
renderTools();

// Alle lampjes in de studio: patroon hangt af van wat er gebeurt
const BONUS_HUE = { coin: 0.01, meteor: 0.07, hunt: 0.43, worm: 0.75 };
function updateMarquee(t) {
  if (!marquee.mesh) return;
  const pk = phaseKey(), r = rnd(), b = r && r.bonus, ts = t / 1000, c = new THREE.Color();
  for (let i = 0; i < marquee.pos.length; i++) {
    const gr = marquee.group[i];
    let on, h = 0.11, sat = 0.95;
    if (pk === 'spinning' || pk === 'comets') on = Math.sin(i * 0.7 - ts * 16) > 0.2;
    else if (pk === 'closing' || (pk === 'betting' && r.bettingEndsAt - t < 5000)) on = Math.floor(ts * 5) % 2 === i % 2;
    else if (pk === 'landed' || pk === 'result') { on = (i + Math.floor(ts * 9)) % 3 !== 0; h = (i * 0.03 + ts * 0.4) % 1; }
    else if (pk === 'bonus' && b) { on = Math.sin(i * 0.5 - ts * 9) > -0.2; h = BONUS_HUE[b.type] + (gr % 2) * 0.05; }
    else on = Math.sin(i * 0.35 - ts * 3 + gr) > -0.3;
    c.setHSL(h, sat, on ? 0.72 : 0.18);
    marquee.mesh.setColorAt(i, c);
  }
  marquee.mesh.instanceColor.needsUpdate = true;
}

// =====================================================
// HOOFDLUS
// =====================================================
let lastFrame = performance.now(), lastHud = 0, lastSpots = 0;
function frame() {
  requestAnimationFrame(frame);
  const p = performance.now(), dt = Math.min(0.05, (p - lastFrame) / 1000);
  lastFrame = p;
  if (!cfg) return;
  glLive = true;
  const t = now();
  updateWheels(t, dt);
  checkEvents(t);
  updateComets(t);
  updateBonus(t, dt);
  updateHost(t, dt);
  updateCamera(t, dt);
  particles.update(dt);
  for (const tile of Object.values(cometBoard.tiles)) { if (tile.pulse > 0) { tile.pulse -= dt; tile.mesh.scale.setScalar(1 + Math.max(0, tile.pulse) * 0.5); } }
  starField.position.copy(camera.position);
  // Het reuzenrad van het Wormgat alleen tonen als we daar echt zijn
  wormWorld.visible = host.world === 'worm';
  updateMarquee(t);
  if (scene.userData.wallMat) scene.userData.wallMat.uniforms.t.value = t / 1000 % 1000;
  scene.traverse(o => { if (o.userData.rise) { const a = o.geometry.attributes.position; for (let k = 0; k < a.count; k++) { let y = a.getY(k) + dt * (0.6 + (k % 5) * 0.15); if (y > 9.4) y = 0.6; a.setY(k, y); } a.needsUpdate = true; } });
  planet.clouds.rotation.y += dt * 0.004; planet.body.rotation.y += dt * 0.002;
  dust.rotation.y += dt * 0.01;
  station.position.y = Math.sin(p / 2400) * 0.04;
  if (p - lastHud > 100) { lastHud = p; renderHud(t); renderResults(); }
  if (p - lastSpots > 500) { lastSpots = p; renderSpots(); }
  placeBubble();
  drawConfetti(dt);
  renderer.render(scene, camera);
}
resize();
introLoad(72);
loadStatus();
// Vangnet: na 15 s mag je altijd door, ook als de verbinding traag is
setTimeout(introReady, 15000);
frame();
