<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vissstick Keys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23f2c14e'/%3E%3Ccircle cx='14' cy='20' r='6.5' fill='none' stroke='%232b1d00' stroke-width='3.4'/%3E%3Cpath d='M20 20h14M29 20v6M34 20v4' stroke='%232b1d00' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e0f11;
    --panel: #16181b;
    --side: #1b1d21;
    --field: #111315;
    --raise: #262a2f;
    --line: rgba(255, 255, 255, 0.07);
    --text: #eceae6;
    --muted: #8d9299;
    --gold: #f2c14e;
    --green: #4cd47b;
    --red: #ef5b4c;
    --teal: #3fbf9f;
    --radius: 14px;
    --common: #9aa7b4;
    --uncommon: #3fbf9f;
    --rare: #4d8dff;
    --epic: #b266ff;
    --legendary: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; min-height: 100vh; overflow-x: hidden; }
  button { font: inherit; color: inherit; }
  .app { max-width: 1280px; margin: 0 auto; padding: 14px 16px 32px; }
  [hidden] { display: none !important; }

  /* Kopregel (zelfde als de andere pagina's) */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .brand svg { width: 36px; height: 36px; flex: none; }
  .brand .word { display: flex; flex-direction: column; line-height: 1; }
  .brand .word small { font-size: 10px; font-weight: 800; letter-spacing: 3px; color: var(--muted); }
  .brand .word b { font-size: 19px; font-weight: 800; letter-spacing: .5px; margin-top: 3px; }
  .user { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 4px; }
  .user img { width: 30px; height: 30px; border-radius: 50%; background: var(--raise); }
  .user .name { font-weight: 700; font-size: 14px; line-height: 1.1; }
  .user .balance { color: var(--gold); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; transition: color .2s, transform .2s; display: inline-block; }
  .user .balance.up { color: var(--green); transform: scale(1.15); }
  .user button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 6px 8px; border-radius: 999px; }
  .user button:hover { background: var(--raise); color: var(--text); }

  /* Achtergrond met leven */
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root { --k: 1; }
  body { background: transparent; }
  .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; background: radial-gradient(ellipse at 50% 0%, #17151f, var(--bg) 65%); }
  .bg i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(100px); opacity: .26; animation: drift 26s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { background: #c98b4d; left: -14vmax; top: 6vmax; }
  .bg i:nth-child(2) { background: #6f8fb8; right: -16vmax; top: -10vmax; animation-delay: -9s; }
  .bg i:nth-child(3) { background: #f2c14e; left: 28vw; bottom: -28vmax; animation-delay: -16s; }
  @keyframes drift { to { transform: translate(9vmax, -7vmax) scale(1.18); } }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  .login { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; max-width: 520px; }
  .login h3 { margin: 0 0 8px; font-size: 18px; }
  .login p { margin: 0 0 6px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  code { background: var(--raise); color: var(--text); padding: 2px 8px; border-radius: 6px; font-weight: 700; }

  /* De drie kisten */
  .crates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; align-items: center; min-height: calc(100vh - 130px); padding: 0 0 30px; perspective: 1300px; }
  .crate {
    --accent: #c98b4d; --accent2: rgba(201,139,77,.3);
    position: relative; text-align: center; padding: 34px 22px 26px; border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.012));
    border: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease, box-shadow .4s ease;
  }
  .crate.k-iron { --accent: #9fc2e8; --accent2: rgba(159,194,232,.3); }
  .crate.k-gold { --accent: #f2c14e; --accent2: rgba(242,193,78,.34); }
  .crate.has { box-shadow: 0 30px 80px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent); }
  /* draaiende gloeirand */
  .crate.has::before { content: ''; position: absolute; inset: -1px; border-radius: 29px; padding: 2px; pointer-events: none;
    background: conic-gradient(from var(--ang), transparent 0 55%, var(--accent) 80%, #fff 90%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spinAng 5s linear infinite; }
  @keyframes spinAng { to { --ang: 360deg; } }
  .crate .stagebox { position: relative; width: min(290px, 86%); margin: 0 auto; }
  .crate .aura { position: absolute; left: 50%; top: 52%; width: 130%; aspect-ratio: 1; transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent2), transparent 62%); opacity: .25; pointer-events: none; }
  .crate.has .aura { opacity: 1; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.14); opacity: .7; } }
  .crate .rays { position: absolute; left: 50%; top: 52%; width: 150%; aspect-ratio: 1; margin: -75% 0 0 -75%; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg, var(--accent) 0 5deg, transparent 5deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%); mask-image: radial-gradient(circle, #000 0, transparent 62%);
    animation: spinRays 30s linear infinite; transition: opacity .5s; }
  .crate.has .rays { opacity: .16; }
  .crate.has:hover .rays { opacity: .34; }
  .crate .art { position: relative; transform: translateZ(40px); animation: floaty 4.2s ease-in-out infinite; }
  .crate:nth-child(2) .art { animation-delay: -1.4s; }
  .crate:nth-child(3) .art { animation-delay: -2.8s; }
  .crate:not(.has) .art { filter: saturate(.3) brightness(.62); animation: none; }
  @keyframes floaty { 50% { transform: translateZ(40px) translateY(-9px); } }
  .crate .art svg { display: block; width: 100%; height: auto; overflow: visible; }
  .crate.has:hover .chest .lid { transform: rotate(-10deg) translate(-1px, -2px); }
  .crate.has:hover .chest .glow { opacity: .7; }
  .crate .sp { position: absolute; left: var(--x); bottom: 30%; width: var(--s); aspect-ratio: 1; background: var(--accent); opacity: 0; pointer-events: none;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 6px var(--accent));
    animation: rise var(--t) ease-out infinite; animation-delay: var(--d); }
  .crate:not(.has) .sp { display: none; }
  @keyframes rise { 0% { transform: translateY(0) scale(.3) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-150px) scale(1) rotate(160deg); opacity: 0; } }
  .crate h3 { position: relative; margin: 16px 0 0; font-size: 24px; letter-spacing: .6px; transform: translateZ(20px); }
  .crate .tag { position: relative; display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
  .crate .tag svg { width: 15px; height: 15px; }
  .crate .have { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px 0 0; transform: translateZ(30px); }
  .crate .have svg { width: 46px; height: 20px; }
  .crate .have b { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .crate.has .have b { color: #fff; text-shadow: 0 0 22px var(--accent); }
  .crate:not(.has) .have svg { filter: grayscale(1) opacity(.5); }
  .crate .open {
    position: relative; overflow: hidden; width: 100%; margin-top: 20px; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 800; letter-spacing: .5px; cursor: pointer;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 65%, #fff), var(--accent)); color: #241600;
    box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 38%, transparent), inset 0 -3px 0 rgba(0,0,0,.18);
    transition: transform .06s, filter .15s; animation: ready 2.4s ease-in-out infinite; transform: translateZ(30px);
  }
  .crate .open::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: sheen 3.2s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { left: -60%; } 100% { left: 140%; } }
  @keyframes ready { 50% { box-shadow: 0 10px 44px color-mix(in srgb, var(--accent) 80%, transparent), inset 0 -3px 0 rgba(0,0,0,.18); } }
  .crate .open:hover:not(:disabled) { filter: brightness(1.08); }
  .crate .open:active:not(:disabled) { transform: translateZ(30px) scale(.98); }
  .crate .open:disabled { background: rgba(255,255,255,.06); color: var(--muted); box-shadow: none; cursor: default; animation: none; }
  .crate .open:disabled::after { display: none; }

  /* Het podium (openen) */
  .stage { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, rgba(26,22,36,.97), rgba(5,5,9,.995)); animation: fadeIn .25s ease; --k: 1; }
  .stage.fast { --k: .5; }
  @keyframes fadeIn { from { opacity: 0; } }
  .stage .rays { position: absolute; left: 50%; top: 42%; width: 190vmax; height: 190vmax; margin: -95vmax 0 0 -95vmax; opacity: 0; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, var(--ray, #f2c14e) 0 6deg, transparent 6deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 38%); mask-image: radial-gradient(circle, #000 0, transparent 38%);
    animation: spinRays 14s linear infinite; transition: opacity .6s; }
  .stage.rays-on .rays { opacity: .32; }
  @keyframes spinRays { to { transform: rotate(360deg); } }
  .stage .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .stage .flash.go { animation: flash .7s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  .stage canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .stage .close { position: absolute; top: 14px; right: 14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); cursor: pointer; padding: 0; color: var(--muted); }
  .stage .close:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,.12); }
  .stage .close:disabled { opacity: .25; cursor: default; }
  .stage .close svg { width: 18px; height: 18px; }
  .stage .snd { right: 62px; }
  .stage .snd.off { color: #5a5f66; }

  .centre { position: relative; z-index: 2; display: grid; place-items: center; width: 100%; height: 100%; padding: 12px 12px 230px; }
  .centre > * { grid-area: 1 / 1; }

  /* Kist en key */
  .chestBox { position: relative; width: min(300px, 70vw); transition: opacity calc(.45s * var(--k)) ease, transform calc(.45s * var(--k)) ease; animation: chestIn calc(.5s * var(--k)) cubic-bezier(.2,1.4,.4,1); }
  .chestBox.away { opacity: 0; transform: scale(.7) translateY(-30px); pointer-events: none; }
  @keyframes chestIn { from { transform: translateY(40px) scale(.7); opacity: 0; } }
  .chestBox svg.chest { display: block; width: 100%; height: auto; overflow: visible; }
  .chestBox.shake svg.chest { animation: shake calc(.8s * var(--k)) linear; }
  @keyframes shake {
    0% { transform: translate(0,0) rotate(0); } 10% { transform: translate(-2px,1px) rotate(-1deg); } 20% { transform: translate(3px,-1px) rotate(1.2deg); }
    30% { transform: translate(-4px,1px) rotate(-1.6deg); } 40% { transform: translate(4px,-2px) rotate(1.8deg); } 50% { transform: translate(-6px,2px) rotate(-2.4deg); }
    60% { transform: translate(6px,-2px) rotate(2.6deg); } 70% { transform: translate(-7px,2px) rotate(-3deg); } 80% { transform: translate(7px,-3px) rotate(3deg); }
    90% { transform: translate(-4px,1px) rotate(-1.5deg); } 100% { transform: translate(0,0) rotate(0); } }
  .chest .lid { transition: transform calc(.5s * var(--k)) cubic-bezier(.2,1.6,.4,1); transform-origin: 28px 80px; }
  .chest .glow { opacity: 0; transition: opacity calc(.3s * var(--k)); }
  .chestBox.open .chest .lid { transform: rotate(-42deg) translate(-4px, -6px); }
  .chestBox.open .chest .glow { opacity: 1; }
  .chest .sparkle { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .chest .sparkle:nth-of-type(2) { animation-delay: -.6s; }
  .chest .sparkle:nth-of-type(3) { animation-delay: -1.2s; }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.1); } }
  .keyfly { position: absolute; left: 16%; top: 52%; width: 34%; margin-top: -7%; transform-origin: 100% 50%; transform: rotate(-90deg); opacity: 0; pointer-events: none; z-index: 2; }
  .keyfly svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  .keyfly.go { animation: keyfly calc(1.1s * var(--k)) cubic-bezier(.3,.9,.3,1) forwards; }
  @keyframes keyfly {
    0% { opacity: 0; translate: 0 320%; rotate: 0deg; }
    35% { opacity: 1; }
    62% { opacity: 1; translate: 0 0; rotate: 0deg; }
    78% { opacity: 1; translate: 0 0; rotate: 0deg; }
    100% { opacity: 1; translate: 0 0; rotate: 48deg; } }
  .keyfly.gone { animation: none; opacity: 0; }

  /* Rad */
  .wheelBox { position: relative; width: var(--wheel, 480px); max-width: 100%; transition: transform .6s cubic-bezier(.2,1.4,.4,1), opacity .4s ease; }
  .wheelBox.hidden { opacity: 0; transform: scale(.55) rotate(-20deg); pointer-events: none; }
  .wheelBox canvas { display: block; width: 100%; aspect-ratio: 1; }
  .wheelBox.shake { animation: bigshake .6s linear; }
  @keyframes bigshake { 10% { transform: translate(-6px, 3px); } 20% { transform: translate(7px, -4px); } 30% { transform: translate(-8px, 2px); } 40% { transform: translate(6px, -3px); }
    50% { transform: translate(-5px, 4px); } 60% { transform: translate(4px, -2px); } 70% { transform: translate(-3px, 2px); } 80% { transform: translate(2px, -1px); } }
  .pointer { position: absolute; left: 50%; top: -1.2%; width: 11%; margin-left: -5.5%; transform-origin: 50% 22%; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .pointer svg { display: block; width: 100%; height: auto; }

  .result { position: absolute; left: 0; right: 0; bottom: 4vh; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 12px; pointer-events: none; text-align: center; }
  .result > * { pointer-events: auto; }
  .result .rar { font-size: 13px; font-weight: 900; letter-spacing: 5px; color: var(--c, var(--gold)); text-shadow: 0 0 16px var(--c, var(--gold)); animation: slam .5s cubic-bezier(.2,1.8,.4,1); }
  .result .pts { display: flex; align-items: center; gap: 12px; font-size: clamp(54px, 10vw, 92px); font-weight: 900; line-height: 1; color: var(--c, var(--gold)); text-shadow: 0 0 36px var(--c, var(--gold)), 0 4px 0 rgba(0,0,0,.4); font-variant-numeric: tabular-nums; animation: slam .55s cubic-bezier(.2,1.8,.4,1); }
  .result .pts svg { width: .62em; height: .62em; flex: none; }
  .result .pts-sub { font-size: 14px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  @keyframes slam { from { transform: scale(2.2); opacity: 0; } }
  .result .btns { display: flex; gap: 10px; margin-top: 12px; animation: fadeIn .5s ease; }
  .result .btns button { border: 0; border-radius: 12px; padding: 13px 22px; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .06s, filter .15s; }
  .result .btns button:active { transform: scale(.97); }
  .result .again { background: linear-gradient(180deg, color-mix(in srgb, var(--k1, #f2c14e) 70%, #fff), var(--k1, #f2c14e)); color: #241600; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .result .done { background: rgba(255,255,255,.09); color: var(--text); border: 1px solid rgba(255,255,255,.14); }
  .result .btns button:hover { filter: brightness(1.1); }
  .hint { position: absolute; bottom: 9vh; z-index: 3; color: var(--muted); font-size: 13px; letter-spacing: 1px; font-weight: 700; }

  .snd { position: absolute; top: 14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #d8dce1; }
  .snd svg { width: 18px; height: 18px; }

  .toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-12px); opacity: 0; z-index: 1200;
    display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px;
    font-size: 15px; font-weight: 700; transition: all .2s ease; pointer-events: none; max-width: calc(100% - 32px);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: #16301f; border: 1px solid var(--green); color: #cdeed8; }
  .toast.err { background: #3a1a17; border: 1px solid var(--red); color: #fbd8d3; }

  @media (max-width: 900px) {
    .crates { grid-template-columns: minmax(0, 1fr); max-width: 420px; margin: 0 auto; min-height: 0; gap: 22px; }
  }
  @media (max-width: 520px) {
    .app { padding: 10px; }
    header { flex-wrap: wrap; }
    .brand .word { display: none; }
    .user { margin-left: auto; }
    .nav { order: 3; width: 100%; margin: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .crate .art, .crate .open, .crate .aura, .bg i { animation: none; }
  }
</style>
<script src="/connection.js?v=16"></script>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="/keys" aria-label="Vissstick Keys">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#f2c14e"/>
        <circle cx="14" cy="20" r="6.5" fill="none" stroke="#2b1d00" stroke-width="3.4"/>
        <path d="M20 20h14M29 20v6M34 20v4" stroke="#2b1d00" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <span class="word"><small>VISSSTICK</small><b>Keys</b></span>
    </a>
    <nav class="nav" aria-label="Spellen"></nav>
    <div class="user" id="user" hidden></div>
  </header>

  <div class="login" id="login" hidden>
    <h3>Niet ingelogd</h3>
    <p>Typ <code>/keys</code> in Discord en klik op de link om je kisten te zien. Dit hoef je maar één keer te doen.</p>
    <p>Keys krijg je van een admin. Heb je er een, dan open je hier een kist en draai je aan het rad.</p>
  </div>

  <div id="content" hidden><div class="crates" id="crates"></div></div>
</div>

<div class="bg"><i></i><i></i><i></i></div>
<canvas id="dust"></canvas>

<div class="stage" id="stage" hidden>
  <div class="rays" id="rays"></div>
  <canvas class="fx" id="fx"></canvas>
  <button class="snd" id="mute" type="button"></button>
  <button class="close" id="close" type="button" aria-label="Sluiten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div class="centre">
    <div class="chestBox" id="chestBox"></div>
    <div class="wheelBox hidden" id="wheelBox">
      <div class="pointer" id="pointer"><svg viewBox="0 0 40 52"><defs><linearGradient id="ptg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#e0a82b"/></linearGradient></defs><path d="M20 50L4 18C-2 6 8 0 20 0s22 6 16 18z" fill="url(#ptg)" stroke="#6b4a08" stroke-width="2"/><circle cx="20" cy="15" r="5.2" fill="#6b4a08"/></svg></div>
      <canvas id="wheel"></canvas>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="result" id="result" hidden></div>
  <div class="flash" id="flash"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('nl-NL');
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOut = t => 1 - (1 - t) ** 4;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  const RARITY = {

  async function loadStatus() {
    try {

      applyStatus(await res.json());

      toast('Geen verbinding met de server.', false);

  function applyStatus(data) {
    if (!data) return;

    if (Number.isFinite(data.serverNow)) offset = data.serverNow - Date.now();
  }
  async function post(path, body = {}) {
    try {
      const res = await fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return await res.json();
    } catch (error) {
      return { ok: false, message: 'Geen verbinding met de server.' };
    }

    const box = $('toast');

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.className = 'toast'; }, ok ? 2800 : 4500);
  }

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([key, value]) => {
      if (value === undefined || value === null || value === false) return;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key === 'html') node.innerHTML = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : value);
    });
    children.forEach(child => node.append(child));
    return node;
  }

  // Zwevend gouddust op de achtergrond
  (function dust() {
    const cv = $('dust'), g = cv.getContext('2d');
    let w = 0, h = 0, d = 1;
    const dots = Array.from({ length: 55 }, () => ({ x: Math.random(), y: Math.random(), r: rand(.6, 2.2), v: rand(.01, .035), ph: rand(0, TAU), c: Math.random() < .6 ? '255,214,120' : '190,215,255' }));
    function fit() { d = Math.min(2, devicePixelRatio || 1); w = cv.width = Math.round(innerWidth * d); h = cv.height = Math.round(innerHeight * d); }
    fit(); addEventListener('resize', fit);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let last = performance.now();
    (function frame(t) {
      const dt = Math.min(.05, (t - last) / 1000); last = t;
      if ($('stage').hidden) {
        g.clearRect(0, 0, w, h);
        for (const p of dots) {
          p.y -= p.v * dt * 3; p.ph += dt * 1.6;
          if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
          g.beginPath(); g.arc(p.x * w, p.y * h, p.r * d, 0, TAU);

        }

    })(last);
  })();

  const stage = $('stage'), wheelBox = $('wheelBox'), wheel = $('wheel'), pointer = $('pointer'), fx = $('fx');

  function shade(hex, f) {

  function drawWheel() {
    const S = wheel.width, c = S / 2, th = THEME[W.kind] || THEME.wood;

      wctx.fillStyle = on ? '#fff6c8' : 'rgba(0,0,0,.4)';
      if (on) { wctx.shadowColor = '#ffd24a'; wctx.shadowBlur = rimW * 0.9; }
      wctx.fill(); wctx.shadowBlur = 0;
    }

    // vakken
    for (let i = 0; i < n; i++) {
      const seg = W.segs[i];
      const a0 = W.theta + i * slice - Math.PI / 2 - slice / 2, a1 = a0 + slice;
      const rar = RARITY[seg.rarity];
      const isWin = W.win === i;
      const grow = isWin ? S * 0.012 * W.winT : 0;
      const gr = wctx.createRadialGradient(c, c, rIn * 0.15, c, c, rIn + grow);
      gr.addColorStop(0, shade(rar.color, 0.42)); gr.addColorStop(1, shade(rar.color, i % 2 ? 0.95 : 0.8));
      wctx.beginPath(); wctx.moveTo(c, c); wctx.arc(c, c, rIn + grow, a0, a1); wctx.closePath();
      wctx.fillStyle = gr; wctx.fill();
      wctx.strokeStyle = 'rgba(0,0,0,.45)'; wctx.lineWidth = S * 0.004; wctx.stroke();
      if (W.win !== null && !isWin) { wctx.fillStyle = `rgba(6,6,10,${0.62 * W.winT})`; wctx.fill(); }
      if (isWin) {
        wctx.save(); wctx.lineWidth = S * 0.012; wctx.strokeStyle = `rgba(255,255,255,${0.55 + 0.45 * Math.sin(W.flash * 14)})`;
        wctx.shadowColor = rar.color; wctx.shadowBlur = S * 0.05; wctx.stroke(); wctx.restore();
      }
      // getal langs de straal
      wctx.save();
      wctx.translate(c, c); wctx.rotate(W.theta + i * slice - Math.PI / 2);
      wctx.textAlign = 'right'; wctx.textBaseline = 'middle';
      const label = fmt(seg.points);
      wctx.font = `900 ${S * (label.length > 4 ? 0.05 : 0.062)}px system-ui, sans-serif`;
      wctx.lineWidth = S * 0.012; wctx.strokeStyle = 'rgba(0,0,0,.55)'; wctx.strokeText(label, rIn * 0.93, 0);
      wctx.fillStyle = seg.rarity === 'legendary' ? '#fff3b8' : '#fff'; wctx.fillText(label, rIn * 0.93, 0);
      wctx.restore();
    }

    // naaf
    wctx.save();
    wctx.shadowColor = 'rgba(0,0,0,.6)'; wctx.shadowBlur = S * 0.03;
    const hg = wctx.createRadialGradient(c - S * 0.02, c - S * 0.02, S * 0.01, c, c, S * 0.1);
    hg.addColorStop(0, shade(th.hub, 1.5)); hg.addColorStop(1, shade(th.hub, 0.6));
    wctx.fillStyle = hg; wctx.beginPath(); wctx.arc(c, c, S * 0.095, 0, TAU); wctx.fill();
    wctx.restore();
    wctx.lineWidth = S * 0.008; wctx.strokeStyle = 'rgba(0,0,0,.4)'; wctx.beginPath(); wctx.arc(c, c, S * 0.095, 0, TAU); wctx.stroke();
    wctx.strokeStyle = 'rgba(255,255,255,.55)'; wctx.lineWidth = S * 0.012; wctx.beginPath(); wctx.arc(c, c, S * 0.062, 0, TAU); wctx.stroke();
    wctx.save(); wctx.translate(c, c); wctx.rotate(W.theta);
    wctx.fillStyle = 'rgba(255,255,255,.85)'; wctx.beginPath(); wctx.arc(0, 0, S * 0.022, 0, TAU); wctx.fill();
    wctx.restore();
  }

  // Munten en confetti
  function burst(rarity) {
    const rect = wheel.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const count = { common: 16, uncommon: 28, rare: 46, epic: 80, legendary: 150 }[rarity] || 16;
    const col = RARITY[rarity].color;
    for (let i = 0; i < count; i++) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), sp = rand(5, rarity === 'legendary' ? 20 : 14);
      particles.push({ kind: 'coin', x: cx, y: cy, vx: Math.cos(a) * sp * rand(.6, 1.2), vy: Math.sin(a) * sp, rot: rand(0, TAU), vr: rand(.15, .4), size: rand(7, 12) * dpr, life: rand(90, 160) });
    }
    if (rarity === 'epic' || rarity === 'legendary') {
      for (let i = 0; i < count * 1.3; i++) {
        particles.push({ kind: 'conf', x: rand(0, innerWidth), y: rand(-80, -10), vx: rand(-1.5, 1.5), vy: rand(2, 6), rot: rand(0, TAU), vr: rand(-.3, .3), size: rand(5, 10) * dpr, color: Math.random() < .5 ? col : ['#fff', '#f2c14e', '#ff7ab6', '#6fd3ff'][i % 4], life: rand(160, 260) });
      }
    }
    startLoop();
  }
  function drawParticles() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    particles = particles.filter(p => p.life > 0 && p.y * dpr < fx.height + 60);
    for (const p of particles) {
      p.life--; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.kind === 'coin') {
        p.vy += 0.42; p.vx *= 0.995;
        const sx = Math.abs(Math.cos(p.rot));
        fctx.save(); fctx.translate(p.x * dpr, p.y * dpr); fctx.scale(Math.max(.12, sx), 1);
        const g = fctx.createLinearGradient(-p.size, -p.size, p.size, p.size);
        g.addColorStop(0, '#fff0a8'); g.addColorStop(1, '#d79a22');
        fctx.fillStyle = g; fctx.beginPath(); fctx.arc(0, 0, p.size, 0, TAU); fctx.fill();
        fctx.lineWidth = p.size * 0.2; fctx.strokeStyle = '#8a5a06'; fctx.stroke();
        fctx.restore();
      } else {
        p.vy += 0.06; p.vx += Math.sin(p.rot) * 0.05;
        fctx.save(); fctx.translate(p.x * dpr, p.y * dpr); fctx.rotate(p.rot); fctx.fillStyle = p.color;
        fctx.globalAlpha = clamp(p.life / 50, 0, 1); fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); fctx.restore();
      }
    }
  }
  function startLoop() {
    if (looping) return;
    looping = true;
    let last = performance.now();
    const frame = t => {
      if (stage.hidden) { looping = false; particles = []; return; }
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      W.bulbs += dt * 0.6;
      if (W.win !== null) { W.flash += dt; W.winT = Math.min(1, W.winT + dt * 4); }
      kick *= 0.82;
      pointer.style.transform = `rotate(${kick}deg)`;
      drawWheel(); drawParticles();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  function resetStage(kind, fast) {
    const c = crateCfg(kind);
    W = { kind, segs: c.segments, theta: rand(0, TAU), win: null, winT: 0, bulbs: 0, flash: 0 };
    kick = 0; particles = [];
    stage.classList.toggle('fast', fast);
    stage.classList.remove('rays-on');
    $('result').hidden = true; $('result').replaceChildren();
    wheelBox.classList.add('hidden'); wheelBox.classList.remove('shake');
    const th = THEME[kind];
    stage.style.setProperty('--ray', th.accent);
    const cb = $('chestBox');
    cb.className = 'chestBox';
    cb.innerHTML = chestSVG(kind) + `<div class="keyfly" id="keyfly">${keySVG(kind)}</div>`;
    cb.style.display = '';
    $('hint').textContent = '';
  }

  function setClosable(v) { closable = v; $('close').disabled = !v; }

  function closeStage() {
    if (!closable) return;
    stage.hidden = true;
    busy = false;
    renderAll();
  }
  $('close').addEventListener('click', closeStage);
  addEventListener('keydown', e => { if (e.key === 'Escape' && !stage.hidden) closeStage(); });

  async function intro(fast) {
    const k = fast ? 0.5 : 1;
    const cb = $('chestBox'), kf = $('keyfly');
    await wait(500 * k);
    kf.classList.add('go'); sfx.key();
    await wait(780 * k); sfx.turn();
    await wait(380 * k);
    kf.classList.add('gone');
    cb.classList.add('shake'); sfx.rumble();
    await wait(850 * k);
    cb.classList.add('open'); sfx.pop();
    const flash = $('flash'); flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    await wait(650 * k);
    cb.classList.add('away'); sfx.whoosh();
    await wait(300 * k);
    wheelBox.classList.remove('hidden');
    await wait(700 * k);
  }

  function spinTo(index, ms) {
    return new Promise(resolve => {
      const n = W.segs.length, slice = TAU / n;
      const jitter = rand(-0.34, 0.34) * slice;
      const desired = -index * slice + jitter;
      const delta = (((desired - W.theta) % TAU) + TAU) % TAU;
      const total = TAU * 6 + delta;
      const start = W.theta, t0 = performance.now();
      let lastTick = Math.floor((-start) / slice + 0.5);
      let prev = start;
      const step = now2 => {
        const t = clamp((now2 - t0) / ms, 0, 1);
        W.theta = start + total * easeOut(t);
        const speed = clamp((W.theta - prev) / (slice * 1.2), 0, 1); prev = W.theta;
        const idx = Math.floor((-W.theta) / slice + 0.5);
        if (idx !== lastTick) { lastTick = idx; sfx.tick(speed); kick = clamp(-8 - speed * 22, -30, -8); }
        if (t < 1) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
  }

  function countUp(node, to, ms) {
    return new Promise(resolve => {
      const t0 = performance.now();
      const step = t => {
        const k = clamp((t - t0) / ms, 0, 1);
        const v = Math.round(to * easeOut(k));
        node.textContent = `+${fmt(v)}`;
        if (k < 1) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
  }

  async function openCrate(kind, fast = false) {
    if (busy || !me || !me.linked) return;
    const c = crateCfg(kind);
    if (!c || !(me.keys && me.keys[kind] > 0)) return;
    busy = true;
    setClosable(false);
    sizeCanvases();
    resetStage(kind, fast);
    stage.hidden = false;
    startLoop();

    // De server bepaalt de uitslag meteen; de show eronder is alleen animatie
    const request = post('/api/keys/open', { kind });
    await intro(fast);
    const res = await request;
    if (!res || !res.ok) {
      toast((res && res.message) || 'Openen mislukt.', false);
      if (res) applyStatus(res);
      setClosable(true);
      stage.hidden = true; busy = false;
      renderAll();
      return;
    }

    $('hint').textContent = 'Daar gaat ie...';
    await spinTo(res.index, 5200);
    $('hint').textContent = '';

    // Uitslag
    const rar = RARITY[res.rarity] || RARITY.common;
    W.win = res.index; W.winT = 0; W.flash = 0;
    stage.style.setProperty('--ray', rar.color);
    if (res.rarity === 'epic' || res.rarity === 'legendary') stage.classList.add('rays-on');
    if (res.rarity === 'legendary') { wheelBox.classList.add('shake'); const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
    sfx.win(res.rarity);
    burst(res.rarity);
    for (let i = 0; i < Math.min(8, Math.ceil(res.points / 40) + 2); i++) setTimeout(() => sfx.coin(i), 120 + i * 70);

    const numNode = el('span', { text: '+0' });
    const box = $('result');
    box.style.setProperty('--c', rar.color);
    box.style.setProperty('--k1', THEME[kind].accent);
    box.replaceChildren(
      el('div', { class: 'rar', text: rar.name }),
      el('div', { class: 'pts' }, [el('span', { html: coinSVG() }), numNode]),
      el('div', { class: 'pts-sub', text: 'PUNTEN' })
    );
    box.hidden = false;
    await countUp(numNode, res.points, res.rarity === 'legendary' ? 1500 : 900);

    // Cijfers bijwerken
    me.balance = res.balance;
    me.keys = res.keys; me.stats = res.stats; me.history = res.history;
    renderBalance(true);

    const left = res.keys[kind] || 0;
    const btns = el('div', { class: 'btns' });
    if (left > 0) btns.append(el('button', { class: 'again', type: 'button', text: `Nog een openen (${left} over)`, onclick: () => { busy = false; openCrate(kind, true); } }));
    btns.append(el('button', { class: 'done', type: 'button', text: 'Klaar', onclick: closeStage }));
    box.append(btns);
    setClosable(true);
  }

  // Een nieuwe open begint pas als de vorige klaar is
  loadStatus();
})();
</script>
</body>
</html>
