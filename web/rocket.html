<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vissstick Rocket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23f2c14e'/%3E%3Cg transform='rotate(45 20 20)'%3E%3Cpath d='M17.2 28.6h5.6L20 35.5z' fill='%23e2552f'/%3E%3Cpath d='M20 5.5c4.2 3.6 5.8 8.8 5.8 14v8H14.2v-8c0-5.2 1.6-10.4 5.8-14z' fill='%2316181b'/%3E%3Cpath d='M14.2 20.5l-4.2 5.6v3.4l4.2-2.4zM25.8 20.5l4.2 5.6v3.4l-4.2-2.4z' fill='%2316181b'/%3E%3Ccircle cx='20' cy='16.5' r='2.7' fill='%23f2c14e'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e0f11;
    --panel: #16181b;
    --side: #1b1d21;
    --field: #111315;
    --raise: #262a2f;
    --line: rgba(255, 255, 255, 0.07);
    --text: #eceae6;
    --muted: #8d9299;
    --orange: #f2c14e;
    --green: #4cd47b;
    --green-dark: #2fb862;
    --red: #ef5b4c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; min-height: 100vh; }
  button, input { font: inherit; color: inherit; }
  .app { max-width: 1320px; margin: 0 auto; padding: 14px 16px 16px; }

  /* Kopregel */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .brand svg { width: 36px; height: 36px; flex: none; }
  .brand .word { display: flex; flex-direction: column; line-height: 1; }
  .brand .word small { font-size: 10px; font-weight: 800; letter-spacing: 3px; color: var(--muted); }
  .brand .word b { font-size: 19px; font-weight: 800; letter-spacing: .5px; margin-top: 3px; }
  .nav { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-right: auto; margin-left: 18px; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 999px; }
  .nav a:hover { color: var(--text); }
  .nav a.active { background: var(--raise); color: var(--text); }
  .user { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 4px; }
  .user[hidden] { display: none; }
  .user img { width: 30px; height: 30px; border-radius: 50%; background: var(--raise); }
  .user .name { font-weight: 700; font-size: 14px; line-height: 1.1; }
  .user .balance { color: var(--orange); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .user button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 6px 8px; border-radius: 999px; }
  .user button:hover { background: var(--raise); color: var(--text); }

  /* Spelvlak: zijbalk + grafiek */
  .game {
    display: grid; grid-template-columns: 310px minmax(0, 1fr);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; height: clamp(520px, calc(100vh - 90px), 760px);
  }
  .sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .betbox { padding: 16px; border-bottom: 1px solid var(--line); }
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Tabbladen */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--field); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .tabs button { border: 0; background: none; border-radius: 999px; padding: 8px 0; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tabs button.active { background: var(--raise); color: var(--text); }
  .tabs button:disabled { cursor: not-allowed; }

  /* Velden */
  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field label span { font-weight: 600; }
  .inputrow { display: flex; background: var(--field); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .inputrow:focus-within { border-color: var(--orange); }
  .inputrow input {
    flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 10px 12px;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .inputrow input[readonly] { color: var(--muted); }
  .inputrow button {
    border: 0; border-left: 1px solid var(--line); background: var(--raise); color: var(--text);
    padding: 0 12px; font-size: 13px; font-weight: 700; cursor: pointer; min-width: 42px;
  }
  .inputrow button:hover:not(:disabled) { filter: brightness(1.2); }
  .inputrow button:disabled, .inputrow input:disabled { opacity: .5; cursor: not-allowed; }

  /* Grote knop */
  .play {
    width: 100%; border: 0; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 800;
    cursor: pointer; background: var(--green); color: #062612; transition: transform .06s ease, filter .15s ease;
    font-variant-numeric: tabular-nums;
  }
  .play:hover:not(:disabled) { filter: brightness(1.06); }
  .play:active:not(:disabled) { transform: scale(.98); }
  .play:disabled { background: var(--raise); color: var(--muted); cursor: not-allowed; }
  .play.cashout { background: var(--orange); color: #241a02; font-size: 18px; }
  .play.stop { background: var(--red); color: #fff; }
  .play + .play { margin-top: 8px; }
  .autoinfo { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }
  .link { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; }
  .last { margin-top: 12px; font-size: 13px; color: var(--muted); text-align: center; }
  .last b { font-variant-numeric: tabular-nums; }
  .win { color: var(--green); }
  .loss { color: var(--red); }

  .login { text-align: center; padding: 10px 4px; }
  .login h3 { margin: 0 0 8px; font-size: 16px; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .login code { background: var(--raise); color: var(--text); padding: 2px 8px; border-radius: 6px; font-weight: 700; }

  /* Spelerslijst */
  .plist-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .plist-head .total { color: var(--orange); font-variant-numeric: tabular-nums; }
  .players { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; min-height: 0; }
  .players li {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) 52px 64px; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .players li:nth-child(odd) { background: rgba(255,255,255,.025); }
  .players li.me { background: rgba(242, 193, 78, .09); }
  .players img { width: 22px; height: 22px; border-radius: 50%; background: var(--raise); }
  .players .pname { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .players .pbal { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .players .pmult { text-align: right; font-weight: 700; color: var(--muted); }
  .players .pamt { text-align: right; font-weight: 800; color: var(--muted); }
  .players .empty { display: block; text-align: center; color: var(--muted); padding: 14px 0; background: none !important; }

  /* Grafiek + topbalk */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; position: relative; z-index: 1; }
  .conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex: none; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .conn.off i { background: var(--red); }
  .history { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-left: auto; min-width: 0; flex-direction: row-reverse; }
  .history::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .chip.low { color: #fff; background: var(--raise); }
  .chip.high { color: #062612; background: var(--green); }
  .canvas-wrap { position: relative; flex: 1; min-height: 0; }
  .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-12px); opacity: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px;
    font-size: 15px; font-weight: 700; transition: all .2s ease; pointer-events: none; max-width: calc(100% - 32px);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .toast::before { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: #16301f; border: 1px solid var(--green); color: #cdeed8; }
  .toast.ok::before { content: '✓'; background: var(--green); color: #062612; }
  .toast.err { background: #3a1a17; border: 1px solid var(--red); color: #fbd8d3; }
  .toast.err::before { content: '✕'; background: var(--red); color: #fff; }

  /* Melding in de zijbalk, blijft staan tot de volgende actie */
  .notice {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; line-height: 1.45;
    background: rgba(239,91,76,.12); border: 1px solid rgba(239,91,76,.55); color: #fbd8d3;
  }
  .notice.ok { background: rgba(76,212,123,.10); border-color: rgba(76,212,123,.5); color: #cdeed8; }

  @media (max-width: 860px) {
    .game { grid-template-columns: minmax(0, 1fr); height: auto; }
    .main { order: -1; height: min(62vh, 460px); border-bottom: 1px solid var(--line); }
    .sidebar { border-right: 0; }
    .players { max-height: 340px; }
  }
  @media (max-width: 520px) {
    .app { padding: 10px; }
    header { flex-wrap: wrap; }
    .brand .word { display: none; }
    .user { margin-left: auto; }
    .nav { order: 3; width: 100%; margin: 0; }
    .nav a { flex: 1; text-align: center; padding: 7px 2px; font-size: 12px; white-space: nowrap; }
  }
</style>
<script src="/connection.js?v=1"></script>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="/rocket" aria-label="Vissstick Rocket">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#f2c14e"/>
        <g transform="rotate(45 20 20)">
          <path d="M17.2 28.6h5.6L20 35.5z" fill="#e2552f"/>
          <path d="M20 5.5c4.2 3.6 5.8 8.8 5.8 14v8H14.2v-8c0-5.2 1.6-10.4 5.8-14z" fill="#16181b"/>
          <path d="M14.2 20.5l-4.2 5.6v3.4l4.2-2.4zM25.8 20.5l4.2 5.6v3.4l-4.2-2.4z" fill="#16181b"/>
          <circle cx="20" cy="16.5" r="2.7" fill="#f2c14e"/>
        </g>
      </svg>
      <span class="word"><small>VISSSTICK</small><b>Rocket</b></span>
    </a>
    <nav class="nav"><a href="/rocket" class="active">Rocket</a><a href="/blackjack">Blackjack</a><a href="/plinko">Plinko</a><a href="/slots">Slots</a><a href="/spin">Daily spin</a></nav>
    <div class="user" id="user" hidden></div>
  </header>

  <div class="game">
    <aside class="sidebar">
      <div class="betbox" id="action"></div>
      <div class="plist-head"><span id="playerCount">Spelers</span><span class="total" id="playerTotal"></span></div>
      <ul class="players" id="players"></ul>
    </aside>
    <section class="main">
      <div class="topbar">
        <div class="conn" id="conn"><i></i><span>Live</span></div>
        <div class="history" id="history"></div>
      </div>
      <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  // =====================================================
  // STATE + KLOK
  // =====================================================
  let state = null;          // publieke spelstatus van de server
  let me = null;             // { linked, user, balance }
  let clockOffset = 0;       // serverTijd - lokale tijd
  const clockSamples = [];

  // Verzendvertraging is altijd positief, dus de grootste meting zit het dichtst bij de echte offset
  function addClockSample(sample) {
    clockSamples.push(sample);
    if (clockSamples.length > 12) clockSamples.shift();
    clockOffset = Math.max(...clockSamples);
  }
  const serverNow = () => Date.now() + clockOffset;

  const $ = id => document.getElementById(id);
  const fmt = m => `${m.toFixed(2)}x`;
  const growth = () => (state && state.config.growth) || 0.18;
  const multiplierAt = t => Math.exp(growth() * t);
  const timeFor = m => Math.log(m) / growth();
  const floorMult = m => Math.floor(m * 100) / 100;

  function myPlayer() {
    if (!state || !state.game || !me || !me.linked) return null;
    return state.game.players.find(p => p.userId === me.user.id) || null;
  }

  function flightTime(game) {
    if (game.phase === 'crashed') return timeFor(game.crashPoint);
    return (serverNow() - game.flightStart) / 1000;
  }

  // =====================================================
  // SERVER
  // =====================================================
  async function api(action, body = {}, quiet = false) {
    try {
      const res = await fetch(`/api/rocket/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'same-origin'
      });
      const data = await res.json();
      if (me && me.linked && typeof data.balance === 'number') me.balance = data.balance;
      if (quiet !== 'silent' && (!quiet || !data.ok)) {
        toast(data.message, data.ok);
        setNotice(data.message, data.ok);
      }
      renderUser();
      return data;
    } catch (error) {
      toast('Geen verbinding met de server.', false);
      return { ok: false };
    }
  }

  async function loadMe() {
    try {
      const res = await fetch('/api/rocket/me', { credentials: 'same-origin' });
      me = await res.json();
    } catch (error) {
      me = { linked: false };
    }
    renderUser();
    renderAction(true);
    renderPlayers();
  }

  let meTimer = null;
  function refreshMeSoon() {
    clearTimeout(meTimer);
    meTimer = setTimeout(loadMe, 300);
  }

  function connect() {
    const es = new EventSource('/api/rocket/stream');
    es.onopen = () => $('conn').classList.remove('off');
    es.onerror = () => $('conn').classList.add('off');
    es.onmessage = event => {
      const data = JSON.parse(event.data);
      addClockSample(data.serverNow - Date.now());
      applyState(data);
    };
    es.addEventListener('time', event => {
      addClockSample(JSON.parse(event.data).serverNow - Date.now());
    });
  }

  function applyState(next) {
    const prev = state;
    state = next;
    const prevGame = prev && prev.game;
    const game = next.game;

    const phaseChanged = !prevGame || !game || prevGame.id !== game.id || prevGame.phase !== game.phase;
    if (phaseChanged && game && game.phase === 'crashed') resetExplosion();

    // Saldo bijwerken als mijn eigen inzet/cashout veranderde (ook auto-cashout)
    if (me && me.linked) {
      const mine = g => g && g.players.find(p => p.userId === me.user.id);
      if (JSON.stringify(mine(prevGame)) !== JSON.stringify(mine(game)) || phaseChanged) refreshMeSoon();
    }

    renderHistory();
    renderPlayers();
    renderAction(phaseChanged);
    autoTick();
  }

  // =====================================================
  // UI
  // =====================================================
  let toastTimer = null;
  function toast(message, ok) {
    if (!message) return;
    const box = $('toast');
    box.textContent = message;
    box.className = `toast show ${ok ? 'ok' : 'err'}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.className = 'toast'; }, ok ? 2800 : 4500);
  }

  // Laatste melding van een actie, getoond in de zijbalk onder de knop
  let notice = null;
  function setNotice(message, ok) {
    notice = message ? { message, ok } : null;
    const box = $('notice');
    if (!box) return;
    box.hidden = !notice;
    if (notice) {
      box.textContent = notice.message;
      box.className = `notice ${notice.ok ? 'ok' : ''}`;
    }
  }

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([key, value]) => {
      if (value === undefined || value === null || value === false) return;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : value);
    });
    children.forEach(child => node.append(child));
    return node;
  }

  function renderUser() {
    const box = $('user');
    box.replaceChildren();
    if (!me || !me.linked) { box.hidden = true; return; }
    box.hidden = false;
    const img = el('img', { alt: '' });
    if (me.user.avatar) img.src = me.user.avatar;
    box.append(
      img,
      el('div', {}, [
        el('div', { class: 'name', text: me.user.username }),
        el('div', { class: 'balance', text: `${me.balance} punten` })
      ]),
      el('button', {
        text: 'Uitloggen',
        title: 'Ontkoppel dit apparaat',
        onclick: async () => { await api('logout'); loadMe(); }
      })
    );
  }

  function renderHistory() {
    $('history').replaceChildren(...(state ? state.history : []).map(m =>
      el('span', { class: `chip ${m >= 2 ? 'high' : 'low'}`, text: fmt(m) })));
  }

  function renderPlayers() {
    const list = $('players');
    const game = state && state.game;
    const players = game ? [...game.players] : [];
    const total = players.reduce((sum, p) => sum + p.bet, 0);
    $('playerCount').textContent = `Spelers ${players.length}`;
    $('playerTotal').textContent = players.length ? `${total} punten` : '';

    if (players.length === 0) {
      list.replaceChildren(el('li', { class: 'empty', text: game && game.phase === 'lobby' ? 'Nog niemand ingestapt.' : 'Geen spelers deze ronde.' }));
      return;
    }

    const crashed = game.phase === 'crashed';
    players.sort((a, b) => (b.cashedAt ? 1 : 0) - (a.cashedAt ? 1 : 0) || (b.cashedAt || 0) - (a.cashedAt || 0) || b.bet - a.bet);
    list.replaceChildren(...players.map(p => {
      const img = el('img', { alt: '' });
      if (p.avatar) img.src = p.avatar;
      let mult = p.autoCashout ? fmt(p.autoCashout) : '—';
      let amount = el('span', { class: 'pamt', text: p.bet });
      if (p.cashedAt) {
        mult = fmt(p.cashedAt);
        amount = el('span', { class: 'pamt win', text: `+${p.payout - p.bet}` });
      } else if (crashed) {
        amount = el('span', { class: 'pamt loss', text: `-${p.bet}` });
      }
      const isMe = me && me.linked && p.userId === me.user.id;
      return el('li', { class: isMe ? 'me' : '' }, [
        img,
        el('div', { style: 'min-width:0' }, [
          el('span', { class: 'pname', text: p.username }),
          el('span', { class: 'pbal', text: `Saldo ${p.balance.toLocaleString('nl-NL')}` })
        ]),
        el('span', { class: `pmult ${p.cashedAt ? 'win' : ''}`, text: mult }),
        amount
      ]);
    }));
  }

  // Ingevulde waarden blijven bewaard tussen renders
  const form = { mode: 'manual', bet: '100', auto: '2.00' };

  // Auto-inzet: zet elke ronde automatisch dezelfde inzet in tot je stopt
  let autoPlay = null; // { bet, cashout, rounds, lastGameId, nextTry, jitter }
  let autoBusy = false;

  function renderAction(force) {
    const box = $('action');
    const game = state && state.game;
    const phase = game ? game.phase : 'idle';
    const mine = myPlayer();
    const key = [phase, game && game.id, me && me.linked, mine && mine.bet, mine && mine.autoCashout, mine && mine.cashedAt, form.mode, autoPlay ? autoPlay.rounds : '-'].join('|');
    if (!force && box.dataset.key === key) return;
    if (box.dataset.key && box.dataset.key.split('|')[0] !== phase) notice = null;
    box.dataset.key = key;
    box.replaceChildren();

    if (!me) return;

    if (!me.linked) {
      box.append(el('div', { class: 'login' }, [
        el('h3', { text: 'Niet ingelogd' }),
        el('p', {}, ['Wil je meedoen? Typ ', el('code', { text: '/rocket' }), ' in Discord en klik op de link. Meekijken kan altijd.'])
      ]));
      return;
    }

    const cfg = state ? state.config : { minBet: 10, maxBet: 250 };
    const editable = phase !== 'flying' && !autoPlay;
    if (mine && phase === 'lobby' && !autoPlay) {
      form.bet = String(mine.bet);
      if (mine.autoCashout) { form.mode = 'auto'; form.auto = mine.autoCashout.toFixed(2); }
    }

    // Tabbladen
    const tab = (mode, label) => el('button', {
      type: 'button', text: label, class: form.mode === mode ? 'active' : '', disabled: !editable,
      onclick: () => { form.mode = mode; renderAction(true); }
    });
    box.append(el('div', { class: 'tabs' }, [tab('manual', 'Handmatig'), tab('auto', 'Auto')]));

    // Inzet
    const betInput = el('input', { type: 'number', inputmode: 'numeric', min: cfg.minBet, max: cfg.maxBet, value: form.bet, disabled: !editable });
    const maxBet = Math.max(cfg.minBet, Math.min(cfg.maxBet, me.balance + (mine ? mine.bet : 0)));
    const setBet = v => {
      const clamped = Math.max(cfg.minBet, Math.min(maxBet, Math.floor(v) || cfg.minBet));
      betInput.value = clamped; form.bet = String(clamped); updateNet();
    };
    betInput.addEventListener('input', () => { form.bet = betInput.value; updateNet(); });
    box.append(el('div', { class: 'field' }, [
      el('label', {}, ['Inzet', el('span', { text: `${cfg.minBet}–${cfg.maxBet}` })]),
      el('div', { class: 'inputrow' }, [
        betInput,
        el('button', { type: 'button', text: '½', disabled: !editable, onclick: () => setBet(Number(betInput.value) / 2) }),
        el('button', { type: 'button', text: '2×', disabled: !editable, onclick: () => setBet(Number(betInput.value) * 2) }),
        el('button', { type: 'button', text: 'Max', disabled: !editable, onclick: () => setBet(maxBet) })
      ])
    ]));

    // Auto-cashout
    let netInput = null;
    let autoInput = null;
    function updateNet() {
      if (!netInput) return;
      const bet = Number(form.bet) || 0;
      const auto = parseFloat(String(form.auto).replace(',', '.')) || 0;
      netInput.value = auto >= 1 ? `+${Math.floor(bet * auto) - bet}` : '—';
    }
    if (form.mode === 'auto') {
      autoInput = el('input', { type: 'text', inputmode: 'decimal', value: form.auto, disabled: !editable });
      autoInput.addEventListener('input', () => { form.auto = autoInput.value; updateNet(); });
      const step = delta => {
        const current = parseFloat(String(form.auto).replace(',', '.')) || 2;
        const next = Math.max(cfg.minCashout, Math.min(cfg.maxCashout, Math.round((current + delta) * 100) / 100));
        autoInput.value = next.toFixed(2); form.auto = autoInput.value; updateNet();
      };
      netInput = el('input', { type: 'text', readonly: true, tabindex: '-1' });
      box.append(
        el('div', { class: 'field' }, [
          el('label', {}, ['Cashout op', el('span', { text: `${cfg.minCashout}–${cfg.maxCashout}x` })]),
          el('div', { class: 'inputrow' }, [
            autoInput,
            el('button', { type: 'button', text: '−', disabled: !editable, onclick: () => step(-0.25) }),
            el('button', { type: 'button', text: '+', disabled: !editable, onclick: () => step(0.25) })
          ])
        ]),
        el('div', { class: 'field' }, [el('label', { text: 'Netto winst als het lukt' }), el('div', { class: 'inputrow' }, [netInput])])
      );
      updateNet();
    }

    function checkBet() {
      const bet = Number(betInput.value);
      const available = me.balance + (mine ? mine.bet : 0);
      if (!Number.isInteger(bet) || bet < cfg.minBet || bet > cfg.maxBet) return `Ongeldige inzet: kies een bedrag tussen ${cfg.minBet} en ${cfg.maxBet} punten.`;
      if (bet > available) return `Niet genoeg punten: je wilt ${bet} inzetten, maar je hebt er maar ${available}.`;
      return null;
    }
    const guarded = action => async () => {
      const problem = checkBet();
      if (problem) { toast(problem, false); setNotice(problem, false); return; }
      await action();
    };

    const joinBody = () => ({ bet: betInput.value, autoCashout: form.mode === 'auto' ? autoInput.value.trim() || null : null });

    const cashoutButton = () => {
      box.append(el('button', { class: 'play cashout', id: 'cashoutBtn', onclick: cashOut }));
      updateCashoutButton();
    };

    // Auto-tabblad: elke ronde automatisch inzetten
    if (form.mode === 'auto') {
      if (phase === 'flying' && mine && !mine.cashedAt) cashoutButton();
      if (autoPlay) {
        box.append(el('button', { class: 'play stop', text: 'Stop auto', onclick: () => stopAuto() }));
        box.append(el('div', { class: 'autoinfo', text: `Auto actief: ${autoPlay.bet} punten per ronde${autoPlay.cashout ? ` @ ${fmt(Number(autoPlay.cashout))}` : ''} · ${autoPlay.rounds} ${autoPlay.rounds === 1 ? 'ronde' : 'rondes'} gespeeld` }));
      } else {
        box.append(el('button', {
          class: 'play', text: 'Start auto',
          onclick: guarded(async () => {
            const cashout = autoInput.value.trim();
            const value = parseFloat(cashout.replace(',', '.'));
            if (cashout && !(value >= cfg.minCashout && value <= cfg.maxCashout)) {
              const problem = `Ongeldige cashout: kies een multiplier tussen ${cfg.minCashout}x en ${cfg.maxCashout}x.`;
              toast(problem, false); setNotice(problem, false); return;
            }
            autoPlay = { bet: Number(betInput.value), cashout: cashout || null, rounds: 0, lastGameId: null, nextTry: 0, jitter: Math.random() * 1200 };
            toast('Auto staat aan: je zet elke ronde automatisch in.', true);
            renderAction(true);
            autoTick();
          })
        }));
      }
    } else if (phase === 'lobby') {
      box.append(el('button', { class: 'play', text: mine ? 'Inzet aanpassen' : 'Instappen', onclick: guarded(() => api('join', joinBody())) }));
      if (mine) box.append(el('button', { class: 'link', text: 'Uitstappen', onclick: () => api('leave') }));
    } else if (phase === 'flying') {
      if (mine && !mine.cashedAt) {
        cashoutButton();
      } else if (mine) {
        box.append(el('button', { class: 'play', disabled: true, text: `Uitgecasht · +${mine.payout - mine.bet}` }));
      } else {
        box.append(el('button', { class: 'play', disabled: true, text: 'Ronde bezig…' }));
      }
    } else {
      // Geen ronde: starten en meteen instappen (na een crash pas na een korte pauze)
      box.append(el('button', {
        class: 'play', id: 'startBtn', text: 'Start ronde & stap in',
        onclick: guarded(async () => {
          const started = await api('start', {}, true);
          if (started.ok) await api('join', joinBody());
        })
      }));
    }

    box.append(el('div', { id: 'notice', class: 'notice', hidden: true }));
    setNotice(notice && notice.message, notice && notice.ok);

    if (phase === 'crashed' && mine) {
      const won = Boolean(mine.cashedAt);
      box.append(el('div', { class: 'last' }, [
        'Vorige ronde: ',
        el('b', { class: won ? 'win' : 'loss', text: won ? `+${mine.payout - mine.bet}` : `-${mine.bet}` }),
        won ? ` @ ${fmt(mine.cashedAt)}` : ` (crash ${fmt(game.crashPoint)})`
      ]));
    }
  }

  function stopAuto(reason) {
    if (!autoPlay) return;
    autoPlay = null;
    if (reason) {
      toast(`Auto gestopt: ${reason}`, false);
      setNotice(`Auto gestopt: ${reason}`, false);
    } else {
      toast('Auto staat uit.', true);
    }
    renderAction(true);
  }

  async function autoTick() {
    if (!autoPlay || autoBusy || !state || !me || !me.linked) return;
    const game = state.game;
    const phase = game ? game.phase : 'idle';
    autoBusy = true;
    try {
      if (phase === 'lobby') {
        if (myPlayer() || autoPlay.lastGameId === game.id) return;
        autoPlay.lastGameId = game.id;
        const result = await api('join', { bet: autoPlay.bet, autoCashout: autoPlay.cashout }, 'silent');
        if (!autoPlay) return;
        if (!result.ok) { stopAuto(result.message); return; }
        autoPlay.rounds++;
        renderAction(true);
      } else if (phase !== 'flying' && Date.now() >= autoPlay.nextTry && serverNow() >= (state.nextStartAt || 0) + autoPlay.jitter) {
        // Geen ronde bezig: zelf een starten (lukt het niet, dan was iemand anders net eerder)
        autoPlay.nextTry = Date.now() + 1500;
        await api('start', {}, 'silent');
      }
    } finally {
      autoBusy = false;
    }
  }
  setInterval(autoTick, 400);

  function updateStartButton() {
    const button = $('startBtn');
    if (!button || !state) return;
    const wait = Math.ceil((state.nextStartAt - serverNow()) / 1000);
    button.disabled = wait > 0;
    button.textContent = wait > 0 ? `Nieuwe ronde over ${wait}s` : 'Start ronde & stap in';
  }

  function updateCashoutButton() {
    const button = $('cashoutBtn');
    const game = state && state.game;
    const mine = myPlayer();
    if (!button || !game || game.phase !== 'flying' || !mine) return;
    const m = floorMult(multiplierAt(Math.max(0, flightTime(game))));
    button.textContent = `Cash out · ${Math.floor(mine.bet * m)}`;
  }

  let cashingOut = false;
  async function cashOut() {
    if (cashingOut) return;
    cashingOut = true;
    await api('cashout');
    cashingOut = false;
  }

  document.addEventListener('keydown', event => {
    if (event.code !== 'Space' || event.target.tagName === 'INPUT') return;
    if ($('cashoutBtn')) { event.preventDefault(); cashOut(); }
  });

  // =====================================================
  // CANVAS
  // =====================================================
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  new ResizeObserver(resize).observe(canvas);

  const stars = Array.from({ length: 110 }, () => ({
    x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.3, depth: Math.random() * 0.8 + 0.2, tw: Math.random() * Math.PI * 2
  }));
  let starShift = 0;

  const particles = [];
  let explosion = null;
  function resetExplosion() {
    explosion = {
      sparks: Array.from({ length: 40 }, () => ({ a: Math.random() * Math.PI * 2, v: 60 + Math.random() * 200, s: 1.5 + Math.random() * 2.5 })),
      debris: Array.from({ length: 12 }, () => ({ a: Math.random() * Math.PI * 2, v: 30 + Math.random() * 100, spin: (Math.random() - .5) * 10, w: 3 + Math.random() * 6 }))
    };
  }

  function niceStep(range, maxLines) {
    return [0.1, 0.2, 0.5, 1, 2, 5, 10, 20].find(s => range / s <= maxLines) || 20;
  }

  const isSmall = () => W < 560;

  function plotArea() {
    return isSmall()
      ? { left: 44, right: W - 16, top: 16, bottom: H - 30 }
      : { left: 64, right: W - 28, top: 24, bottom: H - 40 };
  }

  function drawBackground(dt, speed) {
    ctx.fillStyle = '#16181b';
    ctx.fillRect(0, 0, W, H);

    starShift += dt * speed;
    const now = performance.now() / 1000;
    ctx.fillStyle = '#ffffff';
    for (const s of stars) {
      const x = ((((s.x - starShift * s.depth) % 1) + 1) % 1) * W;
      const y = ((((s.y + starShift * s.depth * 0.35) % 1) + 1) % 1) * H;
      ctx.globalAlpha = 0.25 + 0.3 * s.depth + 0.15 * Math.sin(now * 2 + s.tw);
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function buildScale(t, m) {
    const area = plotArea();
    const xMax = Math.max(4, t * 1.12);
    const yMax = Math.max(2, 1 + (m - 1) * 1.22);
    return {
      ...area, xMax, yMax,
      px: time => area.left + (time / xMax) * (area.right - area.left),
      py: mult => area.bottom - ((mult - 1) / (yMax - 1)) * (area.bottom - area.top)
    };
  }

  function drawGrid(sc) {
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.lineWidth = 1;

    // Y-as labels als pilletjes, zoals een echte crash grafiek
    const yStep = niceStep(sc.yMax - 1, 5);
    const ticks = [1];
    for (let v = Math.floor(1 / yStep + 1) * yStep; v < sc.yMax; v += yStep) ticks.push(v);
    ctx.textAlign = 'center';
    for (const v of ticks) {
      const y = sc.py(v);
      if (v > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath(); ctx.moveTo(sc.left, y); ctx.lineTo(sc.right, y); ctx.stroke();
      }
      const label = `${+v.toFixed(1)}x`;
      const w = ctx.measureText(label).width + 12;
      ctx.fillStyle = '#262a2f';
      ctx.beginPath(); ctx.roundRect(sc.left - w - 8, y - 9, w, 18, 6); ctx.fill();
      ctx.fillStyle = '#b9bdc3';
      ctx.fillText(label, sc.left - w / 2 - 8, y + 4);
    }

    const xStep = niceStep(sc.xMax, 6);
    ctx.fillStyle = '#8d9299';
    for (let v = xStep; v < sc.xMax; v += xStep) {
      ctx.fillText(`${+v.toFixed(1)}s`, sc.px(v), sc.bottom + 22);
    }
    ctx.strokeStyle = 'rgba(141,146,153,0.35)';
    ctx.beginPath(); ctx.moveTo(sc.left, sc.bottom); ctx.lineTo(sc.right, sc.bottom); ctx.stroke();
  }

  function tracePath(sc, t) {
    const samples = 90;
    ctx.beginPath();
    for (let i = 0; i <= samples; i++) {
      const time = (t * i) / samples;
      const x = sc.px(time), y = sc.py(multiplierAt(time));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  function drawCurve(sc, t, crashed) {
    const tipX = sc.px(t);
    const tipY = sc.py(multiplierAt(t));

    tracePath(sc, t);
    ctx.lineTo(tipX, sc.bottom);
    ctx.lineTo(sc.left, sc.bottom);
    ctx.closePath();
    const fill = ctx.createLinearGradient(0, tipY, 0, sc.bottom);
    fill.addColorStop(0, crashed ? 'rgba(239,91,76,0.85)' : 'rgba(242,193,78,0.95)');
    fill.addColorStop(1, crashed ? 'rgba(239,91,76,0.2)' : 'rgba(226,128,47,0.3)');
    ctx.fillStyle = fill;
    ctx.fill();

    tracePath(sc, t);
    ctx.strokeStyle = crashed ? '#ff9a8f' : '#ffffff';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  // ----- Raket -----
  function drawFlame(thrust, now) {
    if (thrust <= 0) return;
    const flicker = 0.85 + 0.15 * Math.sin(now / 23) + Math.random() * 0.12;
    const len = (26 + 34 * thrust) * flicker;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const glow = ctx.createRadialGradient(-34, 0, 0, -34, 0, 30 + 20 * thrust);
    glow.addColorStop(0, `rgba(255,170,60,${0.45 * thrust})`);
    glow.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(-34, 0, 30 + 20 * thrust, 0, Math.PI * 2); ctx.fill();

    const layer = (length, width, c0, c1) => {
      const g = ctx.createLinearGradient(-30, 0, -30 - length, 0);
      g.addColorStop(0, c0);
      g.addColorStop(1, c1);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-30, -width);
      ctx.bezierCurveTo(-30 - length * 0.35, -width * 1.3, -30 - length * 0.8, -width * 0.35, -30 - length, (Math.random() - .5) * 2);
      ctx.bezierCurveTo(-30 - length * 0.8, width * 0.35, -30 - length * 0.35, width * 1.3, -30, width);
      ctx.closePath();
      ctx.fill();
    };
    layer(len, 6.5, 'rgba(255,120,40,0.95)', 'rgba(255,60,20,0)');
    layer(len * 0.65, 4.5, 'rgba(255,215,90,0.95)', 'rgba(255,150,40,0)');
    layer(len * 0.32, 2.6, 'rgba(255,255,240,1)', 'rgba(180,220,255,0)');
    ctx.restore();
  }

  function drawRocket(x, y, angle, scale, thrust) {
    const now = performance.now();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    drawFlame(thrust, now);

    // Straalpijp
    const nozzle = ctx.createLinearGradient(0, -6, 0, 6);
    nozzle.addColorStop(0, '#5a5f73'); nozzle.addColorStop(0.5, '#9ca1b4'); nozzle.addColorStop(1, '#3a3e4f');
    ctx.fillStyle = nozzle;
    ctx.beginPath(); ctx.moveTo(-24, -5); ctx.lineTo(-31, -7); ctx.lineTo(-31, 7); ctx.lineTo(-24, 5); ctx.closePath(); ctx.fill();

    // Vinnen (achter de romp)
    const fin = ctx.createLinearGradient(-30, -18, -12, -6);
    fin.addColorStop(0, '#8e1418'); fin.addColorStop(1, '#e0393d');
    ctx.fillStyle = fin;
    ctx.beginPath(); ctx.moveTo(-10, -7); ctx.quadraticCurveTo(-18, -9, -27, -19); ctx.lineTo(-29, -19); ctx.lineTo(-25, -7); ctx.closePath(); ctx.fill();
    const fin2 = ctx.createLinearGradient(-30, 18, -12, 6);
    fin2.addColorStop(0, '#6d0f12'); fin2.addColorStop(1, '#c22f33');
    ctx.fillStyle = fin2;
    ctx.beginPath(); ctx.moveTo(-10, 7); ctx.quadraticCurveTo(-18, 9, -27, 19); ctx.lineTo(-29, 19); ctx.lineTo(-25, 7); ctx.closePath(); ctx.fill();

    // Romp: cilinder met metalen glans
    const body = ctx.createLinearGradient(0, -8, 0, 8);
    body.addColorStop(0, '#8d93a8');
    body.addColorStop(0.25, '#ffffff');
    body.addColorStop(0.55, '#d3d6e3');
    body.addColorStop(1, '#5e6378');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-25, -7);
    ctx.lineTo(14, -8);
    ctx.lineTo(14, 8);
    ctx.lineTo(-25, 7);
    ctx.quadraticCurveTo(-27, 0, -25, -7);
    ctx.closePath();
    ctx.fill();

    // Panelen en rode band
    ctx.strokeStyle = 'rgba(40,44,60,0.35)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-6, -7.6); ctx.lineTo(-6, 7.6); ctx.stroke();
    const band = ctx.createLinearGradient(0, -8, 0, 8);
    band.addColorStop(0, '#9e1a1e'); band.addColorStop(0.3, '#ff5a5e'); band.addColorStop(1, '#7a1216');
    ctx.fillStyle = band;
    ctx.fillRect(-21, -7.2, 4, 14.4);

    // Neuskegel
    const nose = ctx.createLinearGradient(0, -8, 0, 8);
    nose.addColorStop(0, '#a3161b'); nose.addColorStop(0.3, '#ff5a5e'); nose.addColorStop(1, '#6d0f12');
    ctx.fillStyle = nose;
    ctx.beginPath();
    ctx.moveTo(14, -8);
    ctx.bezierCurveTo(24, -7.5, 31, -3, 35, 0);
    ctx.bezierCurveTo(31, 3, 24, 7.5, 14, 8);
    ctx.closePath();
    ctx.fill();

    // Raampje
    ctx.fillStyle = '#2b2f45';
    ctx.beginPath(); ctx.arc(3, -0.5, 4.6, 0, Math.PI * 2); ctx.fill();
    const glass = ctx.createRadialGradient(1.8, -2, 0.5, 3, -0.5, 4);
    glass.addColorStop(0, '#d8f6ff'); glass.addColorStop(0.5, '#4fb8e8'); glass.addColorStop(1, '#1b5e8a');
    ctx.fillStyle = glass;
    ctx.beginPath(); ctx.arc(3, -0.5, 3.4, 0, Math.PI * 2); ctx.fill();

    // Middelste vin (van voren gezien)
    ctx.fillStyle = '#7a1216';
    ctx.beginPath(); ctx.moveTo(-12, -1); ctx.lineTo(-28, -1.5); ctx.lineTo(-28, 1.5); ctx.lineTo(-12, 1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Uitlaat: heet vuur dat afkoelt tot rook
  function emitExhaust(x, y, angle, scale, thrust, dt) {
    const back = Math.PI + angle;
    const nx = x + Math.cos(back) * 32 * scale;
    const ny = y + Math.sin(back) * 32 * scale;
    const count = Math.round((40 + 160 * thrust) * dt);
    for (let i = 0; i < count; i++) {
      const spread = (Math.random() - 0.5) * 0.5;
      const speed = (60 + Math.random() * 90) * (0.5 + thrust);
      particles.push({
        x: nx, y: ny,
        vx: Math.cos(back + spread) * speed - 20,
        vy: Math.sin(back + spread) * speed + 8,
        age: 0, life: 0.9 + Math.random() * 1.3, size: (2 + Math.random() * 2) * scale
      });
    }
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 1 - dt * 2.2; p.vy *= 1 - dt * 2.2;
      p.vy -= 6 * dt;
    }
    // Rook (normaal mengen)
    for (const p of particles) {
      const k = p.age / p.life;
      if (k < 0.15) continue;
      ctx.globalAlpha = (1 - k) * 0.22;
      ctx.fillStyle = k < 0.3 ? '#b8a99a' : '#9a9db0';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size + k * 16, 0, Math.PI * 2); ctx.fill();
    }
    // Vuur (optellend licht)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const k = p.age / p.life;
      if (k > 0.2) continue;
      const heat = 1 - k / 0.2;
      ctx.globalAlpha = heat * 0.8;
      ctx.fillStyle = heat > 0.6 ? '#ffe7a0' : '#ff8a3a';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + heat), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    if (particles.length > 1500) particles.splice(0, particles.length - 1500);
  }

  function drawExplosion(x, y, elapsed) {
    if (!explosion) resetExplosion();
    const p = Math.min(1, elapsed / 1.4);
    const fade = 1 - p;

    if (elapsed < 0.15) {
      ctx.fillStyle = `rgba(255,246,213,${0.35 * (1 - elapsed / 0.15)})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.strokeStyle = `rgba(255,179,71,${0.7 * fade})`;
    ctx.lineWidth = 3 * fade + 0.5;
    ctx.beginPath(); ctx.arc(x, y, 10 + p * 120, 0, Math.PI * 2); ctx.stroke();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const core = ctx.createRadialGradient(x, y, 0, x, y, 24 + p * 50);
    core.addColorStop(0, `rgba(255,246,213,${fade})`);
    core.addColorStop(0.4, `rgba(255,123,41,${0.8 * fade})`);
    core.addColorStop(1, 'rgba(237,66,69,0)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(x, y, 24 + p * 50, 0, Math.PI * 2); ctx.fill();
    for (const s of explosion.sparks) {
      const d = s.v * Math.min(elapsed, 1.4) * (1 - p * 0.4);
      ctx.fillStyle = `rgba(255,209,102,${fade})`;
      ctx.beginPath(); ctx.arc(x + Math.cos(s.a) * d, y + Math.sin(s.a) * d + 30 * elapsed * elapsed, s.s * fade + 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    for (const b of explosion.debris) {
      const d = b.v * elapsed;
      ctx.save();
      ctx.translate(x + Math.cos(b.a) * d, y + Math.sin(b.a) * d + 70 * elapsed * elapsed);
      ctx.rotate(b.spin * elapsed);
      ctx.fillStyle = `rgba(190,194,212,${Math.max(0, 1 - elapsed / 2.5)})`;
      ctx.fillRect(-b.w / 2, -2, b.w, 4);
      ctx.restore();
    }
  }

  // Uitcash-labels aan de rechterkant op de hoogte van hun multiplier
  function drawCashoutPills(sc, game, t) {
    const cashed = game.players
      .filter(p => p.cashedAt && timeFor(p.cashedAt) <= t + 0.01)
      .sort((a, b) => b.cashedAt - a.cashedAt)
      .slice(0, 10);
    if (cashed.length === 0) return;

    ctx.font = '700 12px system-ui, sans-serif';
    const pills = cashed.map(p => {
      const text = `${p.username}  +${p.payout - p.bet}`;
      return { p, text, w: Math.min(ctx.measureText(text).width + 22, 200), y: sc.py(p.cashedAt) };
    });
    // Labels niet over elkaar heen
    pills.sort((a, b) => a.y - b.y);
    for (let i = 1; i < pills.length; i++) {
      if (pills[i].y < pills[i - 1].y + 24) pills[i].y = pills[i - 1].y + 24;
    }
    const overflow = pills.length ? pills[pills.length - 1].y - (sc.bottom - 14) : 0;
    if (overflow > 0) pills.forEach(pl => { pl.y -= overflow; });

    for (const pill of pills) {
      const x = sc.right - pill.w;
      // Stip op de curve
      ctx.fillStyle = '#4cd47b';
      ctx.beginPath(); ctx.arc(sc.px(timeFor(pill.p.cashedAt)), sc.py(pill.p.cashedAt), 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(14,15,17,0.85)';
      ctx.beginPath(); ctx.roundRect(x, pill.y - 10, pill.w, 20, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(76,212,123,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#4cd47b';
      ctx.textAlign = 'left';
      ctx.save();
      ctx.beginPath(); ctx.rect(x + 8, pill.y - 10, pill.w - 16, 20); ctx.clip();
      ctx.fillText(pill.text, x + 11, pill.y + 4);
      ctx.restore();
    }
  }

  function drawCenter(lines) {
    const cx = (plotArea().left + plotArea().right) / 2;
    const cy = H * 0.44;
    for (const { text, size, color, weight = 800, dy = 0, spacing = 0 } of lines) {
      ctx.font = `${weight} ${size}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      if ('letterSpacing' in ctx) ctx.letterSpacing = `${spacing}px`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 14;
      ctx.fillText(text, cx, cy + dy);
      ctx.shadowBlur = 0;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    }
  }

  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (!W || !H) { requestAnimationFrame(frame); return; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const game = state && state.game;
    const phase = game ? game.phase : 'idle';
    const big = Math.max(40, Math.min(92, W * 0.1));
    const small = Math.max(12, Math.round(big * 0.2));
    const rocketScale = isSmall() ? 0.9 : 1.25;

    if (phase === 'flying' || phase === 'crashed') {
      const rawT = flightTime(game);
      const t = Math.max(0, rawT);
      const crashed = phase === 'crashed';
      const m = crashed ? game.crashPoint : multiplierAt(t);

      drawBackground(dt, crashed ? 0.004 : 0.02 + Math.min(0.25, (m - 1) * 0.03));
      const sc = buildScale(t, m);
      drawGrid(sc);
      drawCurve(sc, t, crashed);

      const x = sc.px(t), y = sc.py(m);
      const dxdt = (sc.right - sc.left) / sc.xMax;
      const dydt = (growth() * m * (sc.bottom - sc.top)) / (sc.yMax - 1);
      const angle = rawT < 0 ? -Math.PI / 4 : Math.atan2(-dydt, dxdt);

      if (crashed) {
        drawParticles(dt);
        const crashServerTime = game.flightStart + timeFor(game.crashPoint) * 1000;
        drawExplosion(x, y, Math.max(0, (serverNow() - crashServerTime) / 1000));
        drawCashoutPills(sc, game, t);
        drawCenter([
          { text: fmt(game.crashPoint), size: big, color: '#ef5b4c' },
          { text: 'CRASHED', size: small, color: '#ef5b4c', dy: big * 0.3 + small + 4, spacing: 5 }
        ]);
      } else {
        // Liftoff: motor komt op gang, raket trilt
        const thrust = rawT < 0 ? Math.max(0.25, 1 + rawT / 2) * 0.8 : Math.min(1, 0.7 + (m - 1) * 0.1);
        const shake = rawT < 0 ? (Math.random() - 0.5) * 2.5 : 0;
        emitExhaust(x, y, angle, rocketScale, thrust, dt);
        drawParticles(dt);
        drawCashoutPills(sc, game, t);
        drawRocket(x + shake, y + shake, angle, rocketScale, thrust);

        const mine = myPlayer();
        const lines = [{ text: fmt(floorMult(m)), size: big, color: mine && mine.cashedAt ? '#4cd47b' : '#ffffff' }];
        if (rawT < 0) lines.push({ text: `LIFTOFF ${Math.ceil(-rawT)}`, size: small, color: '#f2c14e', dy: big * 0.3 + small + 4, spacing: 5 });
        else if (mine && !mine.cashedAt) lines.push({ text: `${Math.floor(mine.bet * floorMult(m))} punten`, size: Math.max(13, Math.round(big * 0.22)), color: '#4cd47b', dy: big * 0.3 + small + 4, weight: 700 });
        drawCenter(lines);
      }
      updateCashoutButton();
      updateStartButton();
    } else {
      drawBackground(dt, 0.006);
      const sc = buildScale(0, 1);
      drawGrid(sc);
      drawParticles(dt);
      drawRocket(sc.left + 26 * rocketScale, sc.bottom - 26 * rocketScale, -Math.PI / 4, rocketScale, 0);

      if (phase === 'lobby') {
        const left = Math.max(0, (game.launchAt - serverNow()) / 1000);
        drawCenter([
          { text: 'VERTREK OVER', size: small, color: '#8d9299', dy: -big * 0.8 - 6, spacing: 5, weight: 700 },
          { text: `${left.toFixed(1)}s`, size: big, color: '#ffffff' },
          { text: `${game.players.length} ${game.players.length === 1 ? 'speler' : 'spelers'} aan boord`, size: small, color: '#f2c14e', dy: big * 0.3 + small + 4, weight: 700 }
        ]);
        const area = plotArea();
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(area.left, H - 6, area.right - area.left, 3);
        ctx.fillStyle = '#f2c14e';
        ctx.fillRect(area.left, H - 6, (area.right - area.left) * Math.min(1, 1 - left / (state.config.lobbyMs / 1000)), 3);
      } else {
        drawCenter([
          { text: 'Wachten op een nieuwe ronde', size: Math.max(16, Math.round(big * 0.32)), color: '#e4e2de', weight: 700 },
          { text: me && me.linked ? 'Druk op "Start ronde" om er een te starten' : 'Typ /rocket in Discord om mee te doen', size: Math.max(12, Math.round(big * 0.18)), color: '#8d9299', dy: big * 0.3 + small + 4, weight: 600 }
        ]);
      }
    }
    requestAnimationFrame(frame);
  }

  // =====================================================
  // START
  // =====================================================
  const params = new URLSearchParams(location.search);
  if (params.get('login') === 'invalid') {
    setTimeout(() => toast('Die link is ongeldig of verlopen. Typ /rocket in Discord voor een nieuwe.', false), 300);
    history.replaceState(null, '', '/rocket');
  }

  resize();
  loadMe();
  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
